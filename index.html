<script>
const M=['J','F','M','A','M','J','J','A','S','O','N','D'],MN=['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
// tailles minimales indicatives (à vérifier auprès de la DGPA)
const SP=[
{id:'bar',sim:[["Loup tacheté (Dicentrarchus punctatus)", "plus petit, nombreuses petites taches noires nettes sur le dos et les flancs."], ["Mulet", "petite bouche sans dents, dos plat et deux dorsales très espacées."]],ap:'Corps allongé, fusiforme, un peu comprimé ; tête assez longue, grande bouche oblique sans dents visibles. Dos gris argenté à gris-bleu, flancs argentés, ventre blanc. Deux nageoires dorsales bien séparées : la première épineuse, la seconde molle ; opercule avec une tache sombre peu marquée. Les jeunes portent parfois de petites taches noires sur le dos, qui disparaissent avec l’âge. Confusion possible avec le loup tacheté (Dicentrarchus punctatus), plus petit, au corps couvert de nombreuses petites taches noires nettes ; et avec le mulet, qui a une bouche petite, le dos plat et deux dorsales très espacées sans épines fortes. Piquants dorsaux et opercules vulnérants : manipuler avec précaution.',sg:'Eau blanche et brassée autour des roches, des jetées, des embouchures et des sorties de ports ou de lagunes, surtout par houle modérée. Petits poissons fourrage (mulets, athérines, sardines) nerveux près de la surface, sauts ou éclaboussures au crépuscule, oiseaux marins qui piquent sur un même point. Un courant qui contourne un obstacle ou une différence de couleur entre eau claire et eau trouble peut marquer une zone de chasse. Aucun de ces signes ne garantit sa présence.',cy:'Adulte courant : environ 30–60 cm ; peut dépasser 80 cm et atteindre plus d’1 m pour les très vieux sujets. Reproduction en hiver (environ déc.–mars) en mer, les adultes se rassemblant alors au large. Croissance assez lente : les jeunes de 15–25 cm fréquentent lagunes, estuaires et ports, souvent en bancs, et sont fréquents près du bord. Les gros loups sont plutôt solitaires et plus âgés.',n:'Loup / Bar',l:'Dicentrarchus labrax',min:23,s:[10,11,12,1,2,3],b:['Crabe vert','Sardine','Ver de mer','Calamar'],bs:'Crabe : automne · Sardine : hiver',c:'#9fb4bd',p:'spot',lure:'Prédateur, chasse dans l’écume par mer agitée, surtout la nuit.',beh:'Chasse surtout à l’aube, au crépuscule et de nuit ; devient très actif par mer agitée et eau battue qui désoriente ses proies ; se montre méfiant en eau calme et claire.',hab:'Fonds de sable et roche mêlés, plages battues, digues et embouchures ; chasse près du bord dans la zone de déferlement, surtout par mer agitée et eau trouble ; s’éloigne un peu du bord par mer plate et eau claire.',diet:'Prédateur opportuniste : petits poissons (mulets, sardines, athérines) et crustacés (crabes, crevettes) déstabilisés dans le ressac. Chasse du fond à la surface selon la zone de déferlement. Appétit stimulé par une mer agitée et une eau trouble qui gênent ses proies. La sardine et le crabe vert imitent directement ses proies naturelles ; le ver de mer complète en mode opportuniste.',ou:'Présence générale : très commun sur l’ensemble du littoral tunisien, du nord au golfe de Gabès. Secteurs adaptés au surfcasting : plages de sable entrecoupées de roches, embouchures d’oueds, abords de ports et de digues ; se tient juste dans la zone de déferlement, en faible profondeur près du bord, surtout par mer agitée et de nuit.',prof:'Zone d’activité : du bord jusqu’à faible profondeur, dans la zone de déferlement ; chasse aussi bien près du fond qu’en pleine eau selon l’endroit où se brise la vague. Se rapproche nettement du rivage par mer agitée, eau trouble et de nuit ; s’écarte vers des eaux un peu plus profondes par mer plate et en pleine lumière.',quand:'Meilleure période : automne et hiver (oct-mars), en particulier après un coup de vent ou une mer agitée. Privilégier l’aube, le crépuscule et la nuit. Une mer agitée, une eau trouble ou battue et une faible luminosité stimulent nettement l’activité ; par mer plate et eau claire en plein jour, les touches sont plus rares.'},
{id:'dor',sim:[["Daurade grise (Spondyliosoma cantharus)", "pas de croissant doré entre les yeux, teinte plus sombre."], ["Pagre commun (Pagrus pagrus)", "dos plus rosé avec de petits points bleutés, sans croissant doré ni tache rouge sur l’opercule."]],ap:'Corps ovale, haut et comprimé, profil de tête arrondi ; livrée argentée à reflets gris-bleu. Signe distinctif net : une large tache dorée en forme de croissant entre les yeux (front), et une tache noire à l’arrière de l’opercule prolongée de rouge. Dents fortes et arrondies (broyeuses) à l’avant de la bouche. Une seule longue nageoire dorsale à épines. Confusion possible avec la daurade grise (Spondyliosoma cantharus), sans croissant doré, et avec les sars, qui ont des bandes sombres et pas de croissant frontal.',sg:'Fonds sableux près de roches, herbiers ou moulières : coquilles vides, moules ou coques brisées sur la plage après une houle indiquent une ressource alimentaire possible. Eau un peu remuée mais pas trop trouble, gouttières entre deux bancs de sable. Près des lagunes et des zones abritées, chercher aussi les fonds mixtes sable/roche. Ce sont des indices d\'habitat, pas une preuve de présence.',cy:'Adulte courant : environ 25–45 cm ; peut dépasser 60 cm. Reproduction en automne-hiver (environ oct.–déc.) en mer ; les juvéniles grandissent l’été dans les lagunes et zones côtières abritées avant de gagner des fonds plus profonds. Espèce d’abord mâle puis femelle chez beaucoup d’individus : les plus gros sujets sont généralement des femelles. Un jeune se reconnaît à sa petite taille et à la tache dorée entre les yeux moins marquée.',n:'Daurade royale',l:'Sparus aurata',min:19,s:[10,11,12,1,2,3,4],b:['Moule','Coque','Crevette','Ver de vase'],bs:'Moule/coque : hiver · Crevette : automne',c:'#b7c2c7',p:'gold',lure:'Broyeuse de coquillages, fond sableux près des roches.',beh:'Se nourrit activement plutôt à marée montante, par mer calme à modérée ; touche avec prudence et peut recracher l’appât, surtout en eau limpide.',hab:'Fonds sableux proches de zones rocheuses ou d’herbiers, plages, abords de digues et de ports ; se tient assez près du bord près des bancs de coquillages ; tolère une eau légèrement trouble.',diet:'Broyeuse de coquillages (moules, coques, petits gastéropodes) et de crustacés grâce à ses dents puissantes ; complète avec des vers. Se nourrit surtout près du fond, sur les bancs de coquillages. Activité alimentaire plus marquée à marée montante. Moule et coque reproduisent son alimentation naturelle ; la crevette attire par opportunisme.',ou:'Présence générale : largement répandue sur les côtes tunisiennes, avec une bonne représentation dans les lagunes côtières du nord et du centre-est (zones traditionnellement associées à cette espèce). Secteurs adaptés au surfcasting : plages sableuses proches de zones rocheuses ou d’herbiers, abords de ports et de digues ; se tient près du bord au-dessus des bancs de coquillages, en eau peu profonde.',prof:'Zone d’activité : proche du fond, à faible ou moyenne profondeur, au-dessus des bancs de coquillages. Reste assez proche du bord tant que la nourriture y est abondante ; peut s’écarter un peu vers des fonds plus profonds en période plus froide ou en eau très claire et calme.',quand:'Meilleure période : automne et hiver (oct-avril), notamment à marée montante. Peut se pêcher à différents moments de la journée, mais reste prudente en pleine lumière et eau très claire. Une mer calme à modérée favorise les touches ; une mer trop agitée les rend plus rares et plus difficiles à détecter.'},
{id:'sar',sim:[["Sar à tête noire (Diplodus vulgaris)", "large bande noire nette derrière la tête, très marquée même chez l’adulte."], ["Sar à museau pointu (Diplodus puntazzo)", "museau allongé et pointu, dents avant saillantes en râteau."], ["Sparaillon", "plus petit et plus arrondi, anneau noir complet autour du pédoncule caudal."]],ap:'Corps ovale, assez haut, comprimé, gris argenté. Deux marques noires nettes : une grande tache sur le pédoncule caudal (en ‘selle’, sur tout le tour) et une zone sombre sur la nuque/opercule ; barres verticales foncées bien visibles chez les jeunes, s’estompant chez l’adulte. Incisives tranchantes à l’avant de la bouche. Confusion fréquente avec le sar à museau pointu (Diplodus puntazzo : museau allongé, 7–9 barres verticales, dents en râteau) et le sar à tête noire (Diplodus vulgaris, bande noire nette derrière la tête) et le sparaillon (plus petit).',sg:'Roches, blocs, digues et jetées avec algues et moules fixées ; petits poissons visibles en groupe dans l\'eau claire près des pierres, souvent par houle légère qui remue les coquillages. Une eau qui bouillonne au pied des rochers est intéressante. Prudence : ces signes décrivent un bon habitat mais ne garantissent pas la présence de l\'espèce ce jour-là.',cy:'Adulte courant : environ 20–30 cm ; rarement plus de 40 cm. Reproduction surtout en automne (valeurs variables selon les secteurs). Les juvéniles, très fréquents près du bord dans les roches et les ports, montrent des barres verticales sombres plus nettes ; elles s’estompent avec l’âge, l’adulte étant plus argenté avec deux bandes noires (tête et pédoncule caudal).',n:'Sar commun',l:'Diplodus sargus',min:18,s:[9,10,11,12,4,5],b:['Ver de vase','Crevette','Moule','Pâte'],bs:'Ver : automne · Crevette : printemps',c:'#aab4b8',p:'bands',lure:'Zones rocheuses et mixtes, eau un peu troublée.',beh:'Actif de jour, apprécie une eau légèrement trouble ; réputé habile pour grignoter l’appât sans se piquer, demande une vigilance constante sur la touche.',hab:'Zones rocheuses et mixtes (roche/sable), bord de digues et jetées ; reste proche du bord dans les anfractuosités ; apprécie une eau légèrement trouble par petite houle.',diet:'Omnivore opportuniste : broute moules, vers et petits crustacés fixés sur la roche, complète avec de la pâte. Se nourrit près du fond, au ras des anfractuosités. Grignote par petites touches, plus actif de jour en eau légèrement trouble. Moule et ver de vase collent à son régime naturel ; la pâte sert d’appât opportuniste.',ou:'Présence générale : espèce très commune sur l’ensemble des côtes rocheuses tunisiennes. Secteurs adaptés au surfcasting : zones rocheuses et mixtes sable/roche, digues et jetées, notamment sur les côtes où alternent roche et sable (côte nord, cap Bon) ; reste proche du bord dans les anfractuosités.',prof:'Zone d’activité : proche du fond, au ras des roches et anfractuosités, en faible profondeur près du bord. Reste généralement proche du rivage toute l’année, avec une activité un peu plus marquée en eau légèrement trouble.',quand:'Actif surtout de jour, plutôt en début d’automne, en hiver et au printemps (sept-déc, avril-mai). Une eau légèrement trouble et une petite houle stimulent l’activité ; par mer plate et eau très claire, il devient plus méfiant.'},
{id:'den',sim:[["Denté à tête large (Dentex gibbosus)", "front très bombé, teinte plus rosée ; rare près du bord."], ["Denté à gros yeux (Dentex macrophthalmus)", "yeux nettement plus grands, corps plus petit et rosé."], ["Pagre commun (Pagrus pagrus)", "pas de fortes canines à l’avant, points bleutés sur le dos."]],ap:'Corps ovale, robuste et haut, tête forte à profil bombé chez les grands mâles. Dos gris-bleu à gris rosé, flancs plus clairs avec des petits points bleutés épars, surtout chez les jeunes ; nageoire dorsale unique à épines. Bouche large avec de fortes dents canines pointues à l’avant, ce qui le distingue des sars aux incisives. Confusion possible avec le denté à tête large (Dentex gibbosus, front très bombé, plus rosé) et les pagres, dont les dents sont plus arrondies. Manipuler avec prudence à cause des dents et des épines dorsales.',sg:'Tombants, plateaux rocheux et zones de roches à proximité d\'un fond plus profond ; petits poissons fourrage (chinchards, sardines) en nombre, activité d\'oiseaux ou remous dans l\'eau. Un courant qui longe une pointe rocheuse ou une différence de profondeur proche du bord peut marquer une zone de passage. Ces indices sont utiles mais restent des probabilités.',cy:'Adulte courant : environ 30–50 cm ; peut dépasser 80 cm avec l’âge. Croissance relativement lente, donc un gros denté est un vieux poisson. Reproduction au printemps (environ avr.–juin, à confirmer selon les zones). Les jeunes sont plus gris-argenté ; les gros mâles âgés développent un front bossu et une teinte bleutée.',n:'Denté',l:'Dentex dentex',min:20,s:[5,6,9,10,11],b:['Calamar','Sardine','Seiche'],bs:'Calamar toute la saison',c:'#c98f8f',p:'plain',lure:'Prédateur des fonds rocheux, appât frais entier.',beh:'Actif surtout à l’aube et au crépuscule ; prédateur plutôt méfiant qui s’approche peu du bord en pleine lumière, préfère une mer calme à peu agitée.',hab:'Fonds rocheux et tombants, abords de pointes rocheuses et hauts-fonds ; recherche des zones un peu plus profondes que d’autres sparidés, par mer calme à modérée.',diet:'Prédateur strict de poissons et de céphalopodes (calamars, seiches) ; chasse à l’affût près des tombants rocheux, du fond à mi-eau. Plus actif à l’aube et au crépuscule. Le calamar et la seiche imitent ses proies naturelles ; la sardine entière attire comme poisson-appât.',ou:'Présence générale : présent sur les côtes rocheuses tunisiennes, notamment autour des caps et pointes rocheuses (cap Bon, côte nord). Secteurs concernés par le surfcasting : tombants et pointes rocheuses proches d’eaux un peu plus profondes ; nécessite souvent un lancer plus long que pour les autres sparidés, plutôt en dehors des simples plages ouvertes.',prof:'Zone d’activité : du fond à mi-eau, sur des tombants et fonds rocheux généralement plus profonds que ceux fréquentés par les autres sparidés côtiers. Reste plutôt à distance du bord en pleine lumière, et ne s’approche qu’aux heures sombres (aube, crépuscule).',quand:'Meilleure période : fin de printemps et automne (mai-juin, sept-nov). À rechercher surtout à l’aube et au crépuscule, quand la luminosité baisse ; une mer calme à peu agitée est préférable, l’espèce restant méfiante et à distance du bord en pleine lumière.'},
{id:'mar',sim:[["Saupe (Sarpa salpa)", "fines lignes horizontales dorées, sans barres verticales."], ["Sar commun", "museau moins pointu, tache noire sur le pédoncule caudal."]],ap:'Corps allongé et aplati latéralement, museau pointu et petite bouche à lèvres épaisses vers le bas. Fond argenté avec 10 à 14 fines barres verticales sombres et obliques sur les flancs ; une tache sombre à la base de la nageoire pectorale peut être présente. Nageoire dorsale longue et régulière. Confusion possible avec le sar (tache caudale, corps plus haut, incisives) et avec la saupe (Sarpa salpa), qui porte de fines lignes horizontales dorées plutôt que des barres verticales.',sg:'Fonds sableux peu profonds, en particulier le long de plages avec de petits creux ; petits terriers ou trous dans le sable et coquillages enfouis, révélés quand la vague se retire. Eau légèrement teintée mais pas boueuse, gouttières parallèles au rivage. Ce sont des indices de milieu favorable, non de présence certaine.',cy:'Adulte courant : environ 18–28 cm ; maximum connu autour de 40 cm. Reproduction en été (environ juin–sept., variable). Les jeunes, souvent en petits groupes sur fonds sableux près du bord, sont nombreux ; les prises de 12–15 cm correspondent généralement à des individus encore immatures.',n:'Marbré',l:'Lithognathus mormyrus',min:15,s:[4,5,6,7,8,9],b:['Ver de vase','Arénicole','Crevette'],bs:'Ver : printemps-été',c:'#cdbf9f',p:'bands',lure:'Fond sableux, petits appâts fins, très actif l’été.',beh:'Très actif en été, se nourrit de jour comme de nuit sur fond remué par le ressac ; peu farouche, mord souvent par vagues une fois le banc localisé.',hab:'Fonds sableux, plages ouvertes et zones sablo-vaseuses ; se tient proche du bord dans la zone de ressac, surtout l’été ; apprécie une mer légèrement remuée qui délie le sable.',diet:'Fouisseur : fouille le sable avec son museau pointu pour déterrer vers et petits crustacés. Se nourrit au fond, dans la zone de ressac. Une mer légèrement remuée qui délie le sable stimule nettement son appétit. Ver de vase et arénicole reproduisent ses proies naturelles ; la crevette complète en opportuniste.',ou:'Présence générale : espèce commune sur les fonds sableux de tout le littoral, en particulier dans le golfe de Gabès et le golfe de Hammamet où dominent les grandes plages de sable fin. Secteurs adaptés au surfcasting : plages ouvertes de sable, zones sablo-vaseuses, proche du bord dans la zone de ressac, surtout en été.',prof:'Zone d’activité : proche du fond, en faible profondeur, dans la zone de ressac. Se tient très près du bord dès que le fond est légèrement remué, surtout en été ; se fait plus discret par mer plate.',quand:'Espèce d’été (avril à septembre), active aussi bien de jour que de nuit. Une mer légèrement remuée qui délie le sable stimule nettement l’appétit ; l’activité tend à baisser par mer parfaitement plate.'},
{id:'obl',sim:[["Saupe (Sarpa salpa)", "fines lignes horizontales dorées, pas d’anneau noir sur la queue."], ["Sparaillon", "corps plus haut et arrondi, plus petit."]],ap:'Corps ovale, allongé et fusiforme, gris-bleu sur le dos, argenté sur les flancs. Signe caractéristique : un grand anneau noir bien net autour du pédoncule caudal, bordé de clair, et un œil assez grand. Bouche petite avec de fines incisives. Confusion possible avec le sar commun (tache noire plus étendue et bandes sombres visibles), avec la saupe (lignes horizontales dorées) ou avec le sparaillon (corps plus haut et rond).',sg:'Poissons de surface en banc, souvent visibles en eau claire le long des digues, jetées et roches, parfois avec des remous au niveau des miettes ou de la nourriture flottante. La houle légère qui balaie les roches et la présence de petits bancs près de la surface sont des repères. Un banc peu actif ou absent ne prouve pas qu\'il n\'y a pas d\'oblades plus loin.',cy:'Adulte courant : environ 18–25 cm ; peut atteindre environ 30 cm. Reproduction en été (environ mai–août, variable). Vit en banc et regroupe souvent des poissons de tailles proches : un banc de petits sujets indique une classe d’âge jeune. Les juvéniles sont plus petits et plus argentés, la tache noire du pédoncule caudal restant visible à tous les âges.',n:'Oblade',l:'Oblada melanura',min:15,s:[5,6,7,8,9,10],b:['Pain / pâte','Crevette','Ver'],bs:'Pâte : été',c:'#9aa5aa',p:'tail',lure:'Poisson de surface et mi-eau, tache noire sur le pédoncule.',beh:'Actif en pleine journée par mer calme à peu agitée, se nourrit en pleine eau plutôt qu’au fond ; touches vives, peu méfiant en banc.',hab:'Fonds sableux à rocheux, abords de digues et zones portuaires ; évolue en pleine eau plutôt qu’au fond, proche du bord en banc ; mer calme à peu agitée.',diet:'Omnivore opportuniste : plancton, petits invertébrés et débris organiques, y compris restes de nourriture près des ports. Se nourrit en pleine eau plutôt qu’au fond, en banc. Touches vives en pleine journée par mer calme. Le pain/pâte imite les débris flottants ; crevette et ver complètent.',ou:'Présence générale : commune sur l’ensemble du littoral tunisien. Secteurs adaptés au surfcasting : abords de digues, de ports et fonds sableux à rocheux ; évolue en banc en pleine eau plutôt qu’au fond, souvent proche du bord autour des infrastructures portuaires.',prof:'Zone d’activité : pleine eau plutôt que le fond, à faible profondeur près du bord, en banc. Se maintient proche du rivage par mer calme à peu agitée, surtout en pleine journée.',quand:'Meilleure période : du printemps à l’automne (mai-oct), surtout en pleine journée. Une mer calme à peu agitée favorise les bancs proches du bord ; l’activité diminue par mer forte ou eau très trouble.'},
{id:'mul',sim:[["Mulet lippu (Chelon labrosus)", "lèvre supérieure très épaisse, pas de paupière adipeuse marquée."], ["Mulet doré (Chelon auratus)", "tache dorée sur l’opercule et sur la joue, plus petit."], ["Loup (jeune)", "grande bouche oblique, première dorsale à fortes épines ; l’identification exacte des mulets reste délicate."]],ap:'Corps allongé, dos presque plat, tête large et aplatie sur le dessus. Bouche petite, lèvres minces, pas de dents visibles. Dos vert-gris à gris-bleu, flancs argentés avec de fines lignes longitudinales sombres, ventre blanc ; une tache sombre à la base de la nageoire pectorale et un œil recouvert d’une paupière adipeuse (mulet cabot). Deux nageoires dorsales bien séparées, la première courte, à quatre épines. Confusion possible avec les autres mulets (lippu, doré, porc) : difficiles à séparer sans examen des lèvres et de la tache dorée sur l’opercule ; l’identification à l’espèce est délicate. Différence avec le loup : bouche petite et dos plat.',sg:'Bancs qui se déplacent lentement près de la surface, sur sable, vase ou près des ports, surtout par eau calme ; des ondes discrètes ou des petits sauts, des bouches à fleur d\'eau qui broutent l\'algue ou les dépôts sur les pierres, des fonds vaseux ou abrités près des embouchures et lagunes. Une eau calme facilite l\'observation, mais ne garantit rien.',cy:'Adulte courant : environ 30–50 cm ; peut dépasser 70 cm. Reproduction en mer en fin d’été et automne (environ août–nov., à confirmer localement). Les alevins et jeunes remontent volontiers dans les lagunes, ports et embouchures où l’on voit des bancs de petits sujets ; les gros individus sont plus souvent en mer ouverte à la période de reproduction.',n:'Mulet',l:'Mugil cephalus',min:20,s:[8,9,10,11,12],b:['Pain','Pâte de fromage','Ver'],bs:'Pain : toute l’année',c:'#a9b6b1',p:'lines',lure:'Zones de rejets, embouchures et ports.',beh:'Se nourrit à vue en surface, surtout au lever et au coucher du soleil, apprécie une eau calme et légèrement trouble ; très méfiant, fuit au moindre mouvement brusque.',hab:'Zones sablo-vaseuses calmes : embouchures, ports, lagunes et canaux ; très proche du bord, eaux peu profondes et légèrement troubles ; présent toute l’année, plus visible aux beaux jours.',diet:'Brouteur de détritus : filtre la vase et broute algues, micro-organismes et matière organique en suspension, plutôt en surface ou à mi-eau. Peu attiré par un appât classique, ce qui explique des touches rares et délicates. Le pain et la pâte de fromage imitent des débris organiques ; le ver reste secondaire.',ou:'Présence générale : très répandu, en particulier dans les zones sablo-vaseuses calmes du littoral tunisien : embouchures d’oueds, ports, lagunes et canaux du nord et du centre-est. Secteurs adaptés au surfcasting : ces mêmes zones abritées, très proche du bord, en eau peu profonde et légèrement trouble.',prof:'Zone d’activité : surface à mi-eau, en eau très peu profonde et souvent très proche du bord (embouchures, ports, lagunes). Se nourrit à vue, surtout au lever et au coucher du soleil ; fuit vers des eaux plus profondes au moindre dérangement.',quand:'Présent toute l’année mais plus visible aux beaux jours (août-déc). Se nourrit surtout au lever et au coucher du soleil, en eau calme et légèrement trouble ; très sensible au dérangement, ce qui limite les touches en plein jour et par eau très claire.'},
{id:'sol',sim:[["Sole pole (Solea lascaris)", "tache de la pectorale bordée de jaune ; distinction fine entre soles du genre Solea, à vérifier."], ["Turbot / barbue", "corps rond ou en losange, yeux du côté gauche."]],ap:'Poisson plat ovale allongé, les deux yeux du côté droit du corps. Face supérieure brun-gris à brun sombre, souvent marbrée ou tachetée, face inférieure blanche. Petite bouche torsadée et arrondie sur le côté sans yeux, nageoires dorsale et anale bordant tout le corps et rejoignant la queue, petite tache noire sur l’extrémité de la pectorale. Confusion possible avec la sole-langue (Solea aegyptiaca, très proche) et avec les soles ‘tachetées’ ou ‘pole’ ; la distinction à l’espèce est délicate, notamment entre plusieurs Solea de Méditerranée. Le turbot, arrondi et sans écailles, a les yeux à gauche.',sg:'Fonds sablo-vaseux calmes, embouchures, baies abritées et zones où la vague est faible ; peu de signes visibles en surface car l\'espèce est surtout nocturne et reste enfouie le jour. On peut tout au plus repérer un fond meuble régulier, sans forts courants, et une eau assez tranquille en soirée. Les indices directs sont rares et peu fiables.',cy:'Adulte courant : environ 25–40 cm ; peut dépasser 50 cm. Reproduction en fin d’hiver et début de printemps (environ janv.–avr., variable selon les zones). Les juvéniles vivent en eaux peu profondes et abritées, sur fond sablo-vaseux, puis gagnent des fonds plus profonds en grandissant. Une petite sole de moins de 20 cm est un jeune poisson.',n:'Sole',l:'Solea solea',min:20,s:[10,11,12,1,2,3],b:['Ver de vase','Arénicole','Crevette'],bs:'Ver : hiver',c:'#b59d7e',p:'flat',lure:'Fond sableux/vaseux, en soirée et de nuit.',beh:'Comportement nocturne ou crépusculaire, reste enfoui le jour ; se nourrit au contact du fond par mer calme à peu agitée, peu farouche une fois posée.',hab:'Fonds sableux ou vaseux, plages calmes et zones portuaires abritées ; reste posée au fond, proche du bord la nuit ; préfère une eau calme et peu agitée.',diet:'Prédateur discret de petits invertébrés benthiques (vers, petits crustacés) enfouis dans le sable ou la vase. Se nourrit exclusivement au contact du fond, surtout de nuit. Ver de vase, arénicole et crevette correspondent directement à son régime naturel.',ou:'Présence générale : commune sur les fonds sableux et vaseux du littoral, avec une bonne représentation dans le golfe de Gabès, réputé pour ses vastes fonds meubles peu profonds. Secteurs adaptés au surfcasting : plages calmes de sable ou de vase, abords de ports abrités ; reste posée au fond, près du bord, surtout de nuit.',prof:'Zone d’activité : posée au fond, en faible profondeur, souvent très proche du bord la nuit. Reste enfouie et peu active de jour ; devient plus mobile en fin de journée et de nuit, par mer calme.',quand:'Meilleure période : automne-hiver (oct-mars), avec une activité surtout en soirée et de nuit. Une mer calme à peu agitée favorise les touches ; reste peu active et enfouie de jour, notamment par forte luminosité.'},
{id:'pag',sim:[["Pageot acarné (Pagellus acarne)", "teinte plus grise, moins rosée."], ["Pagre commun (Pagrus pagrus)", "plus grand et plus haut, points bleus sur le dos."]],ap:'Corps ovale, assez haut, teinte rosée à rouge-rosé sur le dos, virant à l’argenté rosé sur le ventre. Petite tache sombre à la base de la nageoire pectorale et peau souvent soulignée de fines ponctuations bleutées. Œil grand, bouche moyenne, nageoire dorsale unique à épines. Confusion possible avec le pagre commun (Pagrus pagrus, dos plus rosé et plus grand), le pageot acarné (Pagellus acarne : gris clair, tache pectorale plus nette) et le pagre à points bleus ; l’identification à l’espèce demande un examen plus attentif.',sg:'Fonds sableux ou mixtes sable/roche, mais pas les tout premiers mètres où la vague est la plus forte ; zones où les crevettes et petits crustacés sont abondants, ainsi que des coquilles brisées et débris sur la grève. Eau claire à légèrement teintée. Indices d\'habitat seulement : ils ne remplacent pas l\'observation du terrain.',cy:'Adulte courant : environ 20–35 cm ; peut dépasser 45 cm. Reproduction au printemps-été (environ mai–août, variable). Les jeunes sont fréquents sur les fonds sableux et vaseux peu profonds ; les plus gros individus sont surtout capturés plus loin du bord. Le pageot est d’abord femelle puis devient mâle avec l’âge chez de nombreux individus.',n:'Pageot',l:'Pagellus erythrinus',min:15,s:[5,6,7,8,9,10],b:['Crevette','Calamar','Sardine'],bs:'Crevette : été',c:'#d9948c',p:'plain',lure:'Fond sableux légèrement profond, à distance de lancer.',beh:'Plutôt actif en fin de journée et de nuit sur fonds profonds ; une mer légèrement agitée semble stimuler l’appétit, relativement peu méfiant au large.',hab:'Fonds sableux un peu plus profonds, au-delà de la zone de déferlement ; demande souvent un lancer plus long ; mer calme à modérément agitée.',diet:'Omnivore opportuniste et prédateur occasionnel : crustacés, petits poissons et céphalopodes sur fonds un peu profonds. Se nourrit près du fond. Activité plus marquée en fin de journée et de nuit, par mer légèrement agitée. Crevette, calamar et sardine couvrent l’essentiel de son régime.',ou:'Présence générale : présent sur l’ensemble des côtes tunisiennes sur fonds sableux. Secteurs concernés par le surfcasting : fonds sableux un peu plus profonds, au-delà de la zone de déferlement ; demande souvent un lancer plus long, notamment sur les plages ouvertes exposées au large.',prof:'Zone d’activité : proche du fond, sur des fonds sableux un peu plus profonds, généralement au-delà de la zone de déferlement. Peut s’approcher un peu plus du bord en fin de journée et de nuit, surtout par mer légèrement agitée.',quand:'Meilleure période : de mai à octobre. Plus actif en fin de journée et de nuit ; une mer légèrement agitée semble stimuler l’appétit, alors qu’une mer très plate ou une eau très claire la rend plus discrète et plus éloignée du bord.'},
{id:'spa',sim:[["Oblade", "corps plus allongé et fusiforme, anneau caudal bordé de blanc."], ["Sar à tête noire (jeune)", "large bande noire derrière la tête, absente chez le sparaillon."]],ap:'Petit corps ovale, haut et comprimé, gris-argenté. Signe très net : un anneau noir complet autour du pédoncule caudal (‘selle’ noire) et de fines barres verticales plus ou moins discrètes sur les flancs ; iris souvent jaune-doré. Bouche petite avec des incisives fines. Confusion possible avec l’oblade (anneau caudal noir, mais corps plus fusiforme et plus allongé), le sar commun (plus grand, tache caudale plus étendue) et les jeunes sars ; la taille adulte réduite (souvent moins de 20 cm) aide à le reconnaître.',sg:'Fonds sableux à herbiers près du bord, rebords d\'herbiers et abords de roches basses ; petits poissons visibles sous la surface en eau claire, et présence de petits organismes fixés ou de vers dans le fond meuble. Touche vive et rapide sur de petits appâts. Indices peu spécifiques : ne pas les considérer comme une garantie.',cy:'Adulte courant : environ 12–18 cm ; maximum connu autour de 24 cm. Petite espèce à cycle court : un poisson de 12 cm est déjà proche de l’adulte. Reproduction au printemps et début d’été (environ avr.–juil., à confirmer localement). Les jeunes sont plus petits et plus argentés ; la bande noire du pédoncule caudal reste bien visible à tous les âges.',n:'Sparaillon',l:'Diplodus annularis',min:12,s:[4,5,6,9,10,11],b:['Ver de vase','Crevette','Moule'],bs:'Ver : automne · Crevette : printemps',c:'#b9c0c2',p:'tail',lure:'Petit sparidé des fonds sableux à herbiers, touche vive et rapide.',beh:'Actif de jour, mord par petites touches rapides et répétées ; peu farouche mais vif, un ferrage rapide est utile.',hab:'Fonds sableux à herbiers, proche du bord en zones abritées et peu profondes ; mer calme à peu agitée ; abondant toute la belle saison.',diet:'Petit omnivore opportuniste, proche du sar : vers, petits crustacés et mollusques sur fonds sableux à herbiers. Se nourrit près du fond par petites touches rapides et répétées, surtout de jour. Ver de vase, crevette et moule correspondent bien à son alimentation naturelle.',ou:'Présence générale : très commun sur les côtes tunisiennes, en particulier sur les fonds sableux à herbiers de posidonie bien développés (côte est, golfe de Gabès, zones insulaires). Secteurs adaptés au surfcasting : zones abritées et peu profondes proches du bord, sur sable et herbiers.',prof:'Zone d’activité : proche du fond, en faible profondeur, dans des zones abritées proches du bord. Reste proche du rivage toute la belle saison, avec une activité plus marquée de jour.',quand:'Meilleure période : printemps et automne (avril-juin, sept-nov), avec une activité surtout diurne. Une mer calme à peu agitée favorise les touches rapides et répétées, typiques de cette espèce.'},
{id:'gui',sim:[["Poisson-guitare commun (Rhinobatos cemiculus)", "museau plus long et plus triangulaire, taille supérieure ; séparation difficile à l’œil."], ["Pastenague", "disque en losange, queue fine avec aiguillon venimeux."], ["Ange de mer (Squatina)", "bouche à l’extrémité du museau, grandes pectorales en ailes séparées de la tête ; espèce très menacée."]],ap:'Corps aplati en forme de guitare : disque antérieur triangulaire à museau pointu, sans coupure nette avec le corps allongé, nageoires dorsales et queue bien développées et proches de celles d’un requin. Face supérieure gris-brun à jaunâtre, face inférieure blanche ; bouche en dessous, fentes branchiales sous le corps. C’est un poisson cartilagineux de type raie-requin : à ne pas confondre avec les vraies raies (queue fine) ou les pastenagues ; les autres Rhinobatos sont difficiles à distinguer sur l’aspect extérieur seul ; espèce menacée à ne pas conserver. Rester prudent à cause de la queue, et remettre à l’eau rapidement.',sg:'Fonds sableux ou sablo-vaseux calmes et peu profonds, baies et golfes abrités ; une eau assez calme, avec peu de houle, et des sillons ou marques plates dans le sable sont parfois visibles à l\'aube dans des eaux très peu profondes. L\'espèce est discrète et protégée dans plusieurs pays : observer sans chercher à la déranger, et ne pas voir dans ces signes une preuve de présence.',cy:'Adulte courant : environ 60–100 cm ; peut atteindre environ 1,5 m selon les sources. Croissance lente et maturité tardive, ce qui rend l’espèce fragile. Les femelles donnent naissance à des jeunes déjà formés (elle est ovovivipare), probablement en été ; période exacte peu documentée localement. Un petit individu de 30–40 cm est un jeune ; il ressemble à l’adulte en miniature.',n:'Poisson-guitare',l:'Rhinobatos rhinobatos',min:0,s:[5,6,7,8,9],b:['Sardine','Calamar','Crabe'],bs:'Sardine : été',c:'#b8a78a',p:'ray',prot:'Espèce menacée : remise à l’eau fortement conseillée',lure:'Vit sur fonds sableux et vaseux, souvent de nuit, combat lourd sans vitesse.',beh:'Actif surtout de nuit sur fonds calmes, se nourrit lentement au contact du fond ; peu farouche mais combat lourd et prolongé — à remettre à l’eau.',hab:'Fonds sableux et vaseux, plages ouvertes et zones calmes ; reste posé au fond, parfois proche du bord la nuit ; mer calme, à remettre à l’eau.',diet:'Prédateur lent de crustacés, mollusques et petits poissons enfouis ou posés sur le fond. Se nourrit exclusivement au contact du fond, surtout de nuit. Sardine, calamar et crabe correspondent à son régime ; espèce menacée, à remettre à l’eau après capture.',ou:'Présence générale : espèce menacée, historiquement présente sur les fonds sableux et vaseux peu profonds du littoral tunisien, notamment dans le golfe de Gabès, l’une de ses zones de présence les plus documentées en Méditerranée. Secteurs concernés par le surfcasting : plages ouvertes de sable ou de vase, parfois proche du bord la nuit ; capture à éviter ou à remettre impérativement à l’eau vu son statut de conservation.',prof:'Zone d’activité : posé au fond, en faible à moyenne profondeur. Peut s’approcher du bord la nuit sur fonds calmes ; plus difficile à localiser de jour.',quand:'Présence saisonnière de mai à septembre, avec une activité surtout nocturne sur fonds calmes. Espèce menacée : privilégier l’observation et remettre systématiquement à l’eau toute capture, quelle que soit la période.'},
{id:'tas',sim:[["Bonite à dos rayé (Sarda sarda)", "rayures sombres obliques sur le dos et petites nageoires (finlets) derrière la dorsale et l’anale."], ["Liche amie (Lichia amia)", "quelques petites épines isolées devant la dorsale, corps plus haut."]],ap:'Corps fusiforme, robuste et élancé, tête forte, grande bouche munie de dents petites, pointues, coupantes et serrées. Dos vert-bleu à gris-bleu, flancs argentés, ventre blanc ; une petite tache sombre à la base de la nageoire pectorale. Deux nageoires dorsales, la première courte et épineuse, la seconde longue et molle ; queue fourchue. Confusion possible avec la liche ou les jeunes thons et bonites (rayures ou pédoncule plus fin, dents différentes) et avec les carangues. Dents coupantes : ne pas mettre les doigts dans la bouche.',sg:'Poissons fourrage paniqués, sardines ou petits poissons qui sautent hors de l\'eau, remous, éclaboussures et bouillonnement en surface, oiseaux marins qui plongent au même endroit. L\'eau claire ou légèrement agitée près des pointes et des jetées, avec des courants marqués, peut attirer les bancs de passage. Ces manifestations sont éphémères : elles indiquent une activité, pas une présence garantie.',cy:'Adulte courant : environ 30–60 cm ; peut dépasser 1 m. Reproduction en été en pleine mer (environ juin–août, à confirmer). Croissance rapide : les jeunes de 10–25 cm (parfois appelés « petits tassergals ») arrivent en bancs en fin d’été et automne, les plus gros individus étant plus solitaires ou en petits groupes. Les tailles au sein d’un banc sont souvent homogènes.',n:'Tassergal',l:'Pomatomus saltatrix',min:25,s:[6,7,8,9,10],b:['Sardine','Calamar','Maquereau'],bs:'Sardine : été-automne',c:'#7f9aa6',p:'plain',lure:'Prédateur de banc, attaque en surface, utiliser un bas de ligne renforcé (dents).',beh:'Chasse en banc de façon agressive et bruyante en surface, souvent à l’aube et au crépuscule ; plus actif par mer légèrement agitée, peu méfiant pendant les chasses mais comportement imprévisible.',hab:'Plages ouvertes et pointes rocheuses où se concentrent les bancs de petits poissons ; chasse en pleine eau près du bord lors des attaques ; apprécie une mer légèrement agitée avec du courant.',diet:'Prédateur pélagique féroce, chasse en banc des poissons fourrage (sardines, anchois, maquereaux) en surface ou en pleine eau. Comportement de chasse frénétique, surtout à l’aube et au crépuscule, favorisé par une mer légèrement agitée avec courant. Sardine, calamar et maquereau imitent directement ses proies.',ou:'Présence générale : présent de façon saisonnière sur les côtes tunisiennes, en bancs migrateurs. Secteurs adaptés au surfcasting : plages ouvertes et pointes rocheuses où se concentrent les bancs de poissons fourrage, en pleine eau près du bord lors des chasses, surtout en été et à l’automne.',prof:'Zone d’activité : pleine eau, de la surface jusqu’à une profondeur modérée, en banc mobile. Se rapproche du bord de façon imprévisible lors des chasses actives, surtout à l’aube, au crépuscule et par mer légèrement agitée avec du courant ; s’éloigne rapidement une fois la chasse terminée.',quand:'Meilleure période : été et début d’automne (juin-oct). Chasse surtout à l’aube et au crépuscule, parfois en pleine journée lors d’attaques soudaines ; une mer légèrement agitée avec du courant favorise les concentrations de poissons fourrage et donc les chasses.'},
{id:'orp',sim:[["Balaou / demi-bec", "seule la mâchoire inférieure est longue, le bec supérieur est court."], ["Aiguille (Belone svetovidovi)", "quasi identique, distinction sans intérêt pratique pour la pêche."]],ap:'Corps très allongé et très mince, en forme d’aiguille ; longue mâchoire en bec garni de nombreuses dents pointues, la mâchoire inférieure dépassant un peu la supérieure. Dos vert-bleu à bleu-gris, flancs argentés, ventre blanc ; une nageoire dorsale unique, reculée vers la queue. Squelette verdâtre à l’intérieur, ce qui est normal et sans danger. Confusion possible avec l’aiguille de mer (Belone svetovidovi, plus rare) et surtout avec le balaou (Hyporhamphus), dont seule la mâchoire inférieure est longue et sans dents. Manipuler avec prudence : le bec est très pointu.',sg:'Fins poissons argentés visibles juste sous la surface ou qui sautent en eau calme et claire, souvent au crépuscule et près de la surface ; bancs d\'alevins ou de petits poissons proches, eau peu agitée près du bord, repérables aussi près des ports et jetées. Ces signes sont saisonniers et non certains.',cy:'Adulte courant : environ 40–70 cm ; peut atteindre environ 90–100 cm. Reproduction au printemps (environ avr.–juin), en venant près des côtes dans les zones peu profondes. Les jeunes de 20–30 cm sont plus fins, avec un bec plus court proportionnellement ; les adultes sont nettement plus longs et allongés.',n:'Orphie',l:'Belone belone',min:25,s:[3,4,5,6],b:['Lanière de sardine','Ver de mer','Petit poisson'],bs:'Lanière : printemps',c:'#8fb3a9',p:'needle',lure:'Poisson de surface, longue mâchoire, arrivée au printemps près du bord.',beh:'Actif en surface de jour, chasse en petits bancs près du bord surtout au printemps ; peu farouche mais délicat à ferrer en raison de sa mâchoire osseuse.',hab:'Zone de surface près du bord, plages et abords rocheux, en eau peu profonde ; arrive au printemps, plutôt par mer calme à peu agitée.',diet:'Prédateur de surface, capture petits poissons et invertébrés avec sa longue mâchoire aiguisée. Se nourrit exclusivement en surface, en banc, surtout au printemps par mer calme. Lanière de sardine et petit poisson imitent ses proies ; le ver de mer sert d’appât d’appoint.',ou:'Présence générale : commune au printemps sur l’ensemble du littoral tunisien lors de sa migration côtière. Secteurs adaptés au surfcasting : zone de surface proche du bord, plages et abords rocheux en eau peu profonde, sur toutes les côtes au moment de son passage saisonnier.',prof:'Zone d’activité : strictement en surface, à faible profondeur près du bord. S’approche du rivage au printemps, en banc, surtout par mer calme à peu agitée et en pleine journée.',quand:'Meilleure période : printemps (mars-juin), lors de sa migration côtière. Actif en surface plutôt en journée, par mer calme à peu agitée ; les bancs s’approchent du bord surtout à cette saison.'},
{id:'chi',sim:[["Chinchard commun (Trachurus trachurus)", "queue et nageoires plus grises, moins jaunes ; tri fin délicat."], ["Chinchard bleu (Trachurus picturatus)", "dos bleu-vert plus foncé, moins de jaune."]],ap:'Corps fusiforme, assez allongé, gris-bleu sur le dos et argenté sur les flancs. Signe distinctif : une ligne latérale complètement couverte de grandes écailles osseuses (écussons) sur toute sa longueur, souvent plus nettes vers la queue ; nageoire caudale et parfois nageoires pectorales nettement jaunâtres. Une petite tache sombre sur l’opercule. Confusion possible avec le chinchard commun (Trachurus trachurus : écussons en ligne latérale moins marqués, queue moins jaune) et avec le chinchard à queue jaune ; le tri à l’espèce est difficile sans examen de la ligne latérale.',sg:'Bancs de petits poissons brillants près de la surface ou en mi-eau, oiseaux marins qui se concentrent, eau claire près des jetées, ports et plages profondes ; les bancs peuvent apparaître et disparaître rapidement. Un banc visible aide à se décider, mais il peut aussi ne pas s\'approcher du bord.',cy:'Adulte courant : environ 15–25 cm ; peut atteindre environ 40 cm. Reproduction surtout du printemps à l’été (environ avr.–août, variable). Vit en banc avec des poissons de tailles proches ; un banc de très petits sujets indique une classe d’âge jeune. La tache noire près de l’opercule et la ligne latérale à écailles dures (écussons) sont visibles dès le jeune âge.',n:'Chinchard à queue jaune',l:'Trachurus mediterraneus',min:15,s:[5,6,7,8,9,10],b:['Crevette','Morceau de sardine','Ver'],bs:'Crevette : été',c:'#8ea5ae',p:'yt',lure:'Poisson pélagique de banc, mi-eau, se prend à plusieurs hameçons.',beh:'Actif en banc à mi-eau plutôt en journée, un léger courant semble concentrer les prises ; peu méfiant en banc, touches nombreuses.',hab:'Pleine eau au large des plages et digues, à mi-profondeur, un peu au-delà du bord ; apprécie un léger courant qui concentre les bancs.',diet:'Opportuniste pélagique : plancton, petits crustacés et petits poissons, chassés en banc à mi-eau. Un léger courant qui concentre le plancton et les bancs stimule l’activité alimentaire, surtout en journée. Crevette et morceau de sardine correspondent bien à son régime.',ou:'Présence générale : répandu en pleine eau sur l’ensemble du littoral tunisien. Secteurs concernés par le surfcasting : eaux un peu au large des plages et des digues, à mi-profondeur, plutôt en dehors de la bande côtière immédiate.',prof:'Zone d’activité : pleine eau, à mi-profondeur, plutôt au-delà de la bande côtière immédiate. Se rapproche un peu du bord quand un léger courant concentre les bancs, en journée.',quand:'Meilleure période : de mai à octobre, avec une activité plutôt diurne. Un léger courant qui concentre le plancton et les bancs favorise nettement les touches ; l’activité est plus diffuse par mer très calme sans courant.'},
{id:'rou',sim:[["Rouget-barbet de vase (Mullus barbatus)", "teinte rose plus uniforme, première dorsale sans rayures sombres obliques."]],ap:'Corps allongé et robuste, teinte rose-rouge à brun rougeâtre, parfois avec des bandes longitudinales jaunes ou brunes. Deux longs barbillons sous le menton, très visibles, qui servent à fouiller le sable. Première nageoire dorsale à rayures sombres obliques (caractère typique du rouget de roche). Tête à profil oblique un peu abrupt. Confusion possible avec le rouget-barbet de vase (Mullus barbatus : profil de tête plus droit, sans rayures sombres sur la première dorsale) ; l’identification à l’espèce demande un regard attentif, surtout sur de petits sujets.',sg:'Fonds sableux ou sablo-vaseux bordés de roches ou d\'herbiers, avec de petits crustacés et vers dans le sédiment. Le poisson fouille le fond : eau légèrement troublée par endroits, plumes de sable près des roches. Eau plutôt claire, houle faible à modérée. Indices d\'habitat uniquement, non de présence certaine.',cy:'Adulte courant : environ 15–25 cm ; peut atteindre environ 35–40 cm. Reproduction au printemps et début d’été (environ avr.–juin, à confirmer). Les jeunes de moins de 12 cm vivent souvent en bancs près du bord sur fonds sableux avec herbiers et sont plus pâles ; les adultes ont la teinte rouge-brun plus marquée et se tiennent plus près des roches.',n:'Rouget de roche',l:'Mullus surmuletus',min:11,s:[5,6,7,8,9,10],b:['Ver de vase','Crevette'],bs:'Ver : été',c:'#d4685a',p:'lines',lure:'Fonds sableux mixtes, vive à l’aube.',beh:'Actif surtout tôt le matin et en fin de journée, fouille le fond à l’odorat sur substrat mixte ; assez méfiant, préfère une eau claire et peu agitée.',hab:'Fonds mixtes sable/roche/gravier, abords rocheux et digues ; reste proche du fond près du bord ; préfère une eau claire et peu agitée.',diet:'Fouisseur : utilise ses barbillons sensoriels pour détecter vers et petits crustacés enfouis dans le sable ou la vase mêlés de gravier. Se nourrit exclusivement au fond, surtout tôt le matin et en fin de journée. Ver de vase et crevette reproduisent directement ses proies naturelles.',ou:'Présence générale : commun sur les fonds mixtes sable/roche/gravier du littoral tunisien, notamment sur les côtes où alternent roche et sable (côte nord, cap Bon). Secteurs adaptés au surfcasting : abords rocheux et digues, proche du fond près du bord.',prof:'Zone d’activité : proche du fond, en faible profondeur près du bord, sur substrat mixte. Plus actif tôt le matin et en fin de journée, avec une préférence pour une eau claire et peu agitée.',quand:'Meilleure période : de mai à octobre, avec une activité plus marquée tôt le matin et en fin de journée. Une eau claire et peu agitée est préférable ; l’espèce se fait plus discrète par mer forte ou eau très trouble.'}];
const RECH={"bar": "Prospecter d’abord la zone de déferlement et les 20–40 premiers mètres : écume au pied des roches, sortie de gouttière, angle d’une digue, embouchure d’oued ou de lagune. Placer les lancers sur la ligne où la vague se brise ou juste derrière, et en bordure des courants qui contournent un obstacle. Par mer agitée et eau trouble, rester près du bord ; par mer plate et claire, allonger un peu, surtout de nuit. Sans touche après un bon créneau (aube, crépuscule), changer de zone si l’eau est claire et calme, si aucun fourrage ni oiseau n’apparaît, ou si l’écume se déplace : suivre le brassage plutôt que rester sur un point figé.", "dor": "Chercher les fonds sableux en bordure de roches, d’herbiers ou de bancs de coquillages : lancer à la lisière entre sable et roche/herbier plutôt qu’au milieu d’un fond nu, ou dans une gouttière entre deux bancs de sable. La zone proche du bord suffit souvent quand la nourriture y est abondante ; allonger si l’eau est très claire, calme, ou en période froide. Suivre la marée montante, qui amène le poisson sur les bancs de coquillages. Si rien ne vient, essayer un autre point de la lisière, plus proche ou plus éloigné, et noter la présence de coquilles brisées sur la grève comme indice de ressource, sans y voir une preuve.", "sar": "Cibler le pied des roches, digues et jetées, les anfractuosités et les lisières roche/sable, avec des lancers courts à moyens : l’espèce reste proche du bord. Viser l’eau qui bouillonne au pied des blocs par petite houle, en évitant d’aller droit dans les zones trop encombrées de roches. Explorer plusieurs points le long d’une même digue, en progressant de quelques mètres. Si les touches sont absentes, changer de secteur quand l’eau est très claire et plate, qu’aucune moule ni algue ne borde le fond, ou que les petits poissons ne sont plus visibles près des pierres.", "den": "Rechercher les tombants, plateaux rocheux et pointes qui plongent vers un fond plus profond, avec des lancers à la limite entre le haut-fond et la zone plus profonde, donc souvent à moyenne ou longue distance. Le bord immédiat n’est intéressant qu’aux heures sombres (aube, crépuscule) ; en pleine lumière et mer calme, il reste plutôt à distance. Repérer les regroupements de chinchards ou de sardines, et les courants qui longent une pointe. Sans résultat, déplacer les lancers d’un secteur de tombant à un autre, ou changer de pointe, si le fourrage est absent et l’eau très claire.", "mar": "Lancer dans la zone de ressac des plages ouvertes de sable, surtout dans les gouttières et creux entre bancs de sable, où la vague remue le fond. La bande proche du bord est prioritaire en été, y compris de nuit. Balayer la plage en variant la distance de quelques mètres, puis en se déplaçant le long de la plage. Une fois un banc localisé, les touches peuvent se succéder. Changer de secteur si le fond est plat et l’eau parfaitement calme, si la gouttière a disparu après un changement de houle, ou si plusieurs lancers restent sans réponse.", "obl": "Chercher les bancs en pleine eau près des digues, jetées, roches et abords de ports, plutôt qu’au ras du fond : lancer parallèlement à l’ouvrage, à quelques mètres à quelques dizaines de mètres du bord, là où l’on voit des poissons de surface. Prospecter proche du bord par mer calme à peu agitée, en journée. Si les touches manquent, se déplacer le long de l’ouvrage à la recherche de bancs visibles ou de remous, ou changer de côté selon la houle. Une mer forte ou une eau très trouble dispersent souvent les bancs.", "mul": "Cibler très près du bord : embouchures, canaux, ports, lagunes et eaux sablo-vaseuses calmes, avec des lancers courts et discrets ; aller loin est rarement utile. Repérer les bancs qui se déplacent lentement, les bouches à fleur d’eau et les ondes en surface, surtout au lever et au coucher du soleil. Approcher sans mouvements brusques, car l’espèce fuit au moindre dérangement. Sans indice de banc pendant un bon créneau, changer de secteur (autre côté du chenal ou de la lagune) ou revenir plus tôt ou plus tard à un autre créneau.", "sol": "Chercher les fonds sableux ou sablo-vaseux calmes : plages abritées, baies, abords de ports, embouchures. Lancer à courte ou moyenne distance, de nuit, sur un fond régulier et meuble sans fort courant ; éviter les zones de roches ou d’herbiers. Par mer calme, la sole peut se tenir très près du bord. Peu d’indices visibles existent en surface : varier plusieurs points sur le même fond meuble plutôt qu’un seul. Après une session sans touche, changer de plage ou de baie si la mer est agitée, le fond dur ou caillouteux, ou l’eau très claire sous une forte lune.", "pag": "Viser les fonds sableux un peu plus profonds, au-delà de la zone de déferlement, avec des lancers plutôt moyens à longs, notamment sur les plages ouvertes exposées au large ; la bordure d’un fond mixte sable/roche peut aussi convenir. En fin de journée et de nuit, il peut s’approcher un peu, surtout par mer légèrement agitée. Si les touches manquent, varier la distance avant de changer de plage : allonger si la mer est plate et l’eau claire, raccourcir à la tombée de la nuit. Changer de secteur si le fond est trop pauvre en crustacés, ou si l’eau reste très claire et la mer plate.", "gui": "Espèce menacée : la recherche ne doit pas viser sa capture, et toute prise doit être remise à l’eau avec précaution. Elle fréquente les fonds sableux ou sablo-vaseux calmes et peu profonds, surtout de nuit. Il peut parfois s’approcher du bord en soirée sur les plages ouvertes et baies abritées à fond meuble, à courte ou moyenne distance. Les indices directs sont très rares et peu fiables. Si rien ne vient, mieux vaut ne pas insister sur un même lieu ni chercher spécifiquement à la localiser ; observer l’environnement suffit.", "tas": "Chercher les pointes, plages ouvertes et abords de jetées où les courants concentrent les poissons fourrage, avec des lancers à moyenne ou longue distance vers la zone de chasse. Le poisson chasse en banc, en pleine eau ou en surface, et peut se rapprocher rapidement du bord. Guetter les sauts de sardines, remous, éclaboussures et oiseaux qui plongent, surtout à l’aube et au crépuscule. Sans aucun indice de chasse, l’intérêt est faible : se déplacer vers une autre pointe ou attendre le créneau suivant. Le banc peut disparaître aussi vite qu’il est arrivé.", "orp": "Prospecter la couche superficielle près du bord : plages, abords rocheux, ports et jetées, en eau peu profonde. Les lancers courts à moyens, sur ou juste sous la surface, suffisent quand des bancs sont visibles. Chercher les fins poissons argentés juste sous la surface, par mer calme à peu agitée, surtout au printemps. Sans banc visible, l’intérêt est très faible : changer de secteur, notamment vers d’autres ports ou plages abritées, ou revenir un autre jour. Mer forte et eau trouble sont défavorables à la détection.", "spa": "Prospecter les fonds sableux à herbiers près du bord, les rebords d’herbiers et les abords de roches basses, en zones abritées et peu profondes. Les lancers courts à moyens, près du bord, suffisent souvent, de jour. Les touches vives et répétées indiquent un banc : rester sur la zone quelques minutes. Si elles ne viennent pas, se déplacer le long de la lisière herbier/sable ou vers une autre zone abritée, surtout si l’eau est très claire et la mer trop agitée, ou si les petits organismes fixés et les poissons visibles sous la surface disparaissent.", "chi": "Chercher les bancs en pleine eau à mi-profondeur, un peu au-delà de la bande côtière, au large des plages et digues ; les lancers moyens à longs sont les plus adaptés. Un léger courant qui concentre le plancton et les bancs peut rapprocher le poisson du bord. Guetter les bancs de petits poissons brillants, les oiseaux marins qui se concentrent et l’eau claire près des jetées et ports. Sans touche, essayer d’autres distances ou d’autres jetées ; si aucun indice de banc n’apparaît et que le courant est absent, envisager un autre secteur.", "rou": "Chercher les fonds mixtes sable/gravier/roche, les abords rocheux et digues, avec des lancers courts à moyens près du bord. Viser la lisière entre sable et roche ou herbier, où il fouille le fond, tôt le matin et en fin de journée. Il préfère une eau claire et peu agitée : par mer forte ou eau très trouble, il se fait plus discret. Si les touches manquent, déplacer les lancers le long de la lisière ou passer à un autre secteur mixte, notamment si le fond est uniformément vaseux ou nu, ou si la mer est trop brassée."};SP.forEach(s=>{s.rech=RECH[s.id]});
const MONT={"bar": [["Coulissant", "le poisson sent moins la résistance du plomb : intéressant en eau claire ou mer plus calme, quand il devient méfiant et que l’appât (crabe, sardine, calamar) doit paraître naturel."], ["Fixe", "plomb plus stable dans le ressac et le courant, pour garder l’appât dans la zone de déferlement ou d’écume visée."]], "dor": [["Coulissant", "touche prudente et appât parfois recraché : moins de résistance perçue, appât (moule, coque) posé près du fond sur la lisière sable/roche."], ["Empilé", "permet de proposer plusieurs appâts près du fond le long d’une lisière ou d’un banc de coquillages, utile pour prospecter."]], "sar": [["Fixe", "appât maintenu près du fond, au pied des roches et digues, à courte ou moyenne distance ; un avançon court limite les emmêlements dans les anfractuosités."], ["Coulissant", "touches grignotées, souvent discrètes : la résistance réduite aide à détecter la touche, en eau claire surtout."]], "den": [["Coulissant", "appât (calamar, seiche, sardine fraîche) présenté de façon naturelle vers un tombant à moyenne ou longue distance, pour un prédateur méfiant."], ["Fixe", "plomb stable en cas de courant le long d’une pointe ou d’un tombant, pour rester sur la zone ciblée."]], "mar": [["Empilé", "poisson de ressac parfois en banc : plusieurs appâts près du fond couvrent la gouttière et les creux entre bancs de sable."], ["Fixe", "plomb stable dans le brassage de la zone de ressac, pour tenir la zone visée."]], "obl": [["Coulissant", "avec avançon assez long et perle flottante : l’appât reste plus haut, en pleine eau, où se nourrit l’espèce plutôt qu’au fond."], ["Fixe", "lancer près de l’ouvrage, avançon long, pour présenter l’appât près des bancs visibles le long des digues."]], "mul": [["Coulissant", "espèce très méfiante, en eau calme et peu profonde : moins de résistance perçue avec un lancer court et discret près des embouchures ou ports."], ["Fixe", "avançon assez long et appât léger, près du bord, en eau calme. const HG=`<h2>Comment choisir son hameçon ?</h2><p class="note">Repères généraux et prudents, à adapter selon le secteur, la saison, l’appât et vos essais.</p>
<details open><summary><b>Comment choisir la taille ?</b></summary><p class="note">Le choix dépend surtout de trois choses : la <b>taille et la présentation de l’appât</b> (la pointe et l’ouverture doivent rester libres), la <b>bouche du poisson visé</b> (petite bouche : petit hameçon ; gros poisson : hameçon plus grand et plus solide) et la <b>discrétion recherchée</b> (eau claire ou poissons méfiants : plus petit et plus fin). Plus le n° est grand, plus l’hameçon est petit. En cas de doute, commencer par une taille moyenne et ajuster selon les touches.</p></details>
<details><summary><b>Hameçons selon l’appât</b></summary><div class="note">${HB.map(b=>`<p>• <b>${b} :</b> ${HK.filter(h=>h.bt.includes(b)).map(h=>h.k).join(', ')}</p>`).join('')}</div></details>
<div class="note"><p>• <b>Taille du poisson :</b> l’hameçon doit rester proportionné à la bouche visée. Repères très approximatifs : petits poissons (sparaillon, rouget, marbré) ≈ n° 6 à 10 ; poissons moyens (pageot, oblade, sar, jeune daurade) ≈ n° 2 à 6 ; gros poissons (loup, denté, daurade adulte) ≈ n° 2 jusqu’au 1/0 ou plus. Trop gros : touches refusées ; trop petit : avalage profond, décrochages ou hameçon déformé.</p>
<p>• <b>Taille de l’appât :</b> la pointe et l’ouverture doivent rester dégagées ; un appât qui remplit l’ouverture empêche la piqûre. Un gros appât sur un petit hameçon fait rater les touches ; un très petit appât sur un gros hameçon éveille la méfiance.</p>
<p>• <b>Appât entier, morceau, ver, crustacé :</b> entier (sardine, petit poisson, calamar) → large ouverture et fil solide (Wide Gap, Octopus, O’Shaughnessy) ; morceau (bande de calamar, filet de sardine) → J-Hook, Chinu ou Octopus ; ver (ver de vase, arénicole) → Long Shank, Baitholder/Beak ou Aberdeen, en le laissant libre de la pointe ; crustacé (crevette, crabe) → Chinu, Octopus ou Baitholder, souvent fixé avec un fil élastique.</p>
<p>• <b>Poissons méfiants</b> (eau claire, mer calme, journée) : petit hameçon fin et discret, avançon fin et plus long, appât petit et naturel. Contrepartie : un fil fin est moins résistant, donc ferrage mesuré et contrôle fréquent.</p>
<p>• <b>Distance de lancer :</b> à longue distance l’appât subit de fortes accélérations : préférer un hameçon robuste et un appât bien attaché. Les touches se ressentent moins bien : un hameçon qui se pique seul (Chinu, circle) peut aider. Vérifier la pointe après plusieurs lancers.</p>
<p>• <b>Fond rocheux :</b> hameçon robuste, avançon plutôt court, éviter les fils très fins ; les pointes rentrantes accrochent un peu moins ; prévoir des pertes. <b>Fond sableux :</b> tous types possibles, y compris fils fins ; le sable et les coquilles émoussent la pointe : changer l’hameçon dès qu’il est émoussé ou rouillé.</p>
<p>• <b>Pêche classique ou circle hook :</b> en pêche classique (J-Hook, Aberdeen, Chinu…), on ferre à la touche. Avec un circle hook, on ne ferre pas : on laisse la canne se charger puis on ramène régulièrement ; il se pique souvent dans le coin de la bouche, ce qui aide à relâcher. Les résultats varient selon l’espèce ; à tester d’abord, sans ferrage réflexe.</p>
<p>• <b>Rappels :</b> respecter les tailles minimales et les espèces protégées, utiliser une pince ou un décrochoir, et écraser l’ardillon si vous prévoyez de relâcher.</p></div>`;

ld=(x,y)=>`<polygon points="${x},${y-9} ${x+11},${y+10} ${x-11},${y+10}" fill="#5f6a70"/>`,
sn=(a,b,c,d)=>`<path d="M${a} ${b}L${c} ${d}" stroke="#9ed9e8" stroke-width="2" fill="none"/>`,
tx=(x,y,t)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="10" fill="currentColor">${t}</text>`,
arm=(x,d,len)=>`<circle cx="${x}" cy="${Y}" r="3.5" fill="#b0bec5"/>`+sn(x,Y,x+len,Y+d*20)+hk(x+len,Y+d*20,d),

if(k=='fix'){o+=ln(8,115)+ld(120,Y)+sw(150)+sn(155,Y,310,Y)+hk(310,Y)+tx(120,42,'plomb fixe')+tx(235,42,'avançon en ligne')}

if(k=='a2'){o+=ln(8,320)+ld(325,Y)+arm(190,1,32)+arm(250,1,32)+tx(220,30,'2 empiles, même côté')}
if(k=='a3'){o+=ln(8,320)+ld(325,Y)+arm(140,1,28)+arm(200,1,28)+arm(260,1,28)+tx(200,30,'3 empiles courtes')}
if(k=='pul'){o+=ln(8,300)+ld(308,Y)+sw(210)+sn(215,Y,280,Y)+hk(280,Y)+`<path d="M215 ${Y}L280 ${Y+25}" stroke="#9ed9e8" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>`+tx(210,42,'anneau coulissant')+tx(270,98,'avançon plaqué au plomb au lancer (pointillé)')}
if(k=='lon'){o+=ln(8,300)+`<ellipse cx="312" cy="${Y}" rx="14" ry="6" fill="#5f6a70"/>`+arm(270,1,22)+tx(270,30,'empile très courte')+tx(312,78,'plomb aérodynamique')}
if(k=='agi'){o+=`<path d="M8 ${Y}H300" stroke="#e8c547" stroke-width="4"/><ellipse cx="312" cy="${Y}" rx="12" ry="10" fill="#5f6a70"/><path d="M302 ${Y+8}l-6 9M312 ${Y+10}v10M322 ${Y+8}l6 9" stroke="#9aa" stroke-width="2"/>`+arm(255,1,24)+tx(255,30,'empile courte')+tx(312,88,'plomb grip')}
if(k=='roc'){o+=ln(8,265)+`<path d="M265 ${Y}H290" stroke="#d33" stroke-width="2" stroke-dasharray="3 2"/>`+ld(300,Y)+arm(225,1,24)+tx(225,30,'empile courte')+tx(285,42,'maillon faible')}
return o+'</svg>'}
/* ===== 61 — Liaison espèces ↔ montages : source unique SPMT (identifiants stables), lue par les fiches espèces ET par les fiches montages ===== */
/* Codes : p = l'espèce figure dans « Poissons visés » du montage (MT.po) · C / F / E = la fiche espèce (s.mo) recommande le principe Coulissant / Fixe / Empilé.
   Aucune relation sans l'une de ces justifications ; poisson-guitare (espèce menacée, à remettre à l'eau) volontairement non associé. */
const SPMT={
bar:{sli:'pC',fix:'F',e1:'p',pul:'p',lon:'p',agi:'p',cal:'p'},
dor:{sli:'pC',fix:'p',e1:'p',pat:'pE',e2:'pE',pul:'p',lon:'p',agi:'p',cal:'p',roc:'p'},
sar:{sli:'C',fix:'pF',e1:'p',pat:'p',e2:'p',e3:'p',cal:'p',roc:'p'},
den:{sli:'pC',fix:'F',pul:'p',lon:'p',roc:'p'},
mar:{fix:'pF',pat:'pE',e2:'pE',e3:'pE',agi:'p'},
obl:{sli:'C',fix:'F',cal:'p'},
mul:{sli:'C',fix:'F'},
sol:{sli:'pC',fix:'F'},
pag:{sli:'C',pat:'E',e2:'E'},
spa:{fix:'F',pat:'pE',e2:'pE',e3:'pE',roc:'p'},
tas:{sli:'C',fix:'F'},
orp:{sli:'C',fix:'F'},
chi:{sli:'C',fix:'F'},
rou:{sli:'C',fix:'pF',e1:'p',pat:'p',e2:'p',agi:'p'}};
const SPMTL={C:'Coulissant',F:'Fixe',E:'Empilé'};
let MTFROM=null,SPFROM=null,ASFROM=null,ASPEND=null,ASFK='';const AS={sp:'',bait:'',fond:'',sea:''};
/* relations validées : références inexistantes ignorées, doublons impossibles (une entrée par couple espèce/montage) */
function relAll(){const o=[];Object.keys(SPMT).forEach(s=>{if(!byId(s))return;MT.forEach(m=>{const c=SPMT[s][m.id];if(c)o.push({s,m:m.id,c})})});return o}
const relBySp=sid=>relAll().filter(r=>r.s==sid),relByM=mid=>relAll().filter(r=>r.m==mid);
function relShort(t,n){t=String(t||'').trim();const i=t.search(/[.;] /);if(i>0)t=t.slice(0,i);if(t.length>n){t=t.slice(0,n);const k=t.lastIndexOf(' ');t=t.slice(0,k>40?k:n)+'…'}return t}
function relWhy(s,c){for(const k of 'CFE'){if(c.includes(k)){const x=(s.mo||[]).find(y=>y[0]==SPMTL[k]);if(x&&x[1]){const t=relShort(x[1],130);return t.charAt(0).toUpperCase()+t.slice(1)}}}return'Cité parmi les poissons visés par ce montage.'}
const relCtx=m=>'Fond : '+relShort(m.fd,70)+' · Mer : '+relShort(m.mer,70);
function spMtS(s){try{const L=relBySp(s.id).map(r=>({r,m:MT.find(x=>x.id==r.m)})).filter(x=>x.m),bk=SPFROM&&SPFROM.sp==s.id&&MT.find(x=>x.id==SPFROM.m),
back=bk?`<p class="spmbk noprint"><button type="button" class="g sm" data-mtopen="${blE(bk.id)}" data-mtfrom="${blE(s.id)}">← Retour au montage ${blE(bk.n)}</button></p>`:'',
row=x=>`<div class="spmr"><div class="spmi"><b>${blE(x.m.n)}</b>${x.m.u?' <span class="tag">⚙ configurable</span>':''}<span class="spmw"><b>Intérêt :</b> ${blE(relWhy(s,x.r.c))}</span><span class="spmc">${blE(relCtx(x.m))}</span></div><button type="button" class="g sm noprint" data-mtopen="${blE(x.m.id)}" data-mtfrom="${blE(s.id)}" aria-label="Ouvrir le montage ${blE(x.m.n)} dans le configurateur">Ouvrir le montage</button></div>`;
if(!L.length)return`<div class="spmt" role="group" aria-label="Montages adaptés : ${blE(s.n)}"><div class="spl">🎯 Montages adaptés</div>${back}<p class="note" style="margin:0">Aucun montage de référence pertinent n’est associé à cette espèce${s.prot?' (espèce menacée : remise à l’eau)':''}.</p></div>`;
return`<div class="spmt" role="group" aria-label="Montages adaptés : ${blE(s.n)}"><div class="spl">🎯 Montages adaptés <span class="note">${L.length} · ouvre la fiche dans le configurateur, sans modifier votre montage</span></div>${back}<div class="spml">${L.slice(0,3).map(row).join('')}</div>${L.length>3?`<details><summary>Voir les ${L.length-3} autre${L.length>4?'s':''} montage${L.length>4?'s':''}</summary><div class="spml">${L.slice(3).map(row).join('')}</div></details>`:''}</div>`}catch(e){return''}}
const mtSpTag=id=>{const n=relByM(id).length;return n?`<span class="tag">🐟 ${n} espèce${n>1?'s':''}</span>`:''};
function mtSpHtml(m){try{const L=relByM(m.id).map(r=>byId(r.s)).filter(Boolean);if(!L.length)return'<p class="note">Aucune espèce associée à ce montage dans les fiches.</p>';
return`<div class="mtsp"><p style="margin:0 0 6px"><b>Espèces concernées :</b> <span class="note">mêmes liaisons que « Montages adaptés » des fiches espèces</span></p><div class="row">${L.map(s=>`<button type="button" class="g sm" data-mtsp="${blE(s.id)}" data-mtmid="${blE(m.id)}" aria-label="Voir la fiche espèce : ${blE(s.n)}">🐟 ${blE(s.n)}</button>`).join('')}</div></div>`}catch(e){return''}}
function mtBack(){const s=MTFROM&&byId(MTFROM),a=ASFROM&&ASFROM===mtSel?'<p><button type="button" class="g sm noprint" data-asback="1">← Retour à l’assistant (critères conservés)</button></p>':'';return a+(s?`<p><button type="button" class="g sm noprint" data-mtback="${blE(s.id)}">← Retour à la fiche ${blE(s.n)}</button></p>`:'')}
/* ouverture par identifiant : consulte la fiche dans le configurateur ; S.rig n'est jamais modifié (« Utiliser ce montage » reste l'action explicite) */
function mtOpen(mid,from){const m=MT.find(x=>x.id==mid);if(!m){notify('warn','Montage introuvable',['Cette référence n’existe plus.','Aucune donnée n’a été modifiée.']);return}
SPFROM=null;MTFROM=from&&byId(from)?from:null;gsComp('mt',m.id);notify('info','Montage ouvert : '+m.n,['Votre montage configuré n’est pas modifié. Utilisez « Utiliser ce montage » pour l’appliquer.'],{ms:3200})}
function spShow(id){if(!byId(id)){notify('warn','Espèce introuvable',['Cette référence n’existe plus.']);return}
go('esp');$('q').value='';spfClr();redraw();recordRecent(id);scrollHi('#el [data-sid="'+id+'"]')}
/* ===== 64 — Conditions ↔ montages : règles explicites et centralisées ===== */
/* Seul critère exploitable : l'état de la mer de la session en cours (S.sess.sea), confronté au texte « Conditions de mer » de chaque fiche (MT.mer).
   Équivalence de vocabulaire (fiches → menu de la session) : « calme/plate » = Calme · « peu agitée/houle faible » = Peu agitée · « houle modérée/agitée » = Agitée · « forte houle » = Forte.
   Une valeur absente de ok/no = la fiche ne se prononce pas (adéquation non établie). Aucun seuil de vent : les fiches n'en donnent pas. Rien n'est stocké. */
const MTC={sli:{ok:['Calme','Peu agitée'],no:['Forte']},fix:{ok:['Calme','Peu agitée','Agitée']},e1:{ok:['Calme','Peu agitée','Agitée']},pat:{ok:['Calme','Peu agitée','Agitée']},e2:{ok:['Calme','Peu agitée']},e3:{ok:['Calme']},pul:{ok:['Calme','Peu agitée']},lon:{ok:['Calme','Peu agitée']},agi:{ok:['Agitée']},cal:{ok:['Calme'],no:['Agitée','Forte']},roc:{ok:['Peu agitée','Agitée']}};
const MTSEA=['Calme','Peu agitée','Agitée','Forte'],MTCL={ok:'✓ Pertinent',no:'⚠ Non adapté',nr:'? Non établi',na:'Mer non renseignée'};
let mtCF=false,mtLK=null,mtLC=null;
function mtCond(){const s=S.sess||{},sea=MTSEA.includes(s.sea)?s.sea:'',w=String(s.wind==null?'':s.wind).trim(),d=String(s.windDir||'');return{sea,raw:String(s.sea||''),wind:w,dir:d,key:sea+'|'+w+'|'+d}}
function mtMatch(m,c){c=c||mtCond();const r=MTC[m.id],j=relShort(m.mer,90);
if(!c.sea)return{s:'na',t:c.raw=='Eau trouble'?'« Eau trouble » décrit l’eau, pas l’état de la mer : choisir l’état de la mer pour comparer.':'État de la mer non renseigné : aucune correspondance établie.'};
if(!r)return{s:'nr',t:'Fiche sans critère de mer exploitable.'};
if((r.no||[]).includes(c.sea))return{s:'no',t:'Mer « '+c.sea+' » — fiche : '+j};
if((r.ok||[]).includes(c.sea))return{s:'ok',t:'Mer « '+c.sea+' » — fiche : '+j};
return{s:'nr',t:'Mer « '+c.sea+' » : la fiche ne se prononce pas.'}}
function mtCur(c){const u=S.rig&&S.rig.mont,L=MT.filter(x=>x.u&&x.u==u).map(x=>mtMatch(x,c).s);return L.length&&L.includes('no')&&!L.includes('ok')?'no':L.includes('ok')?'ok':'nr'}
function mtPanel(){const c=mtCond(),r=S.rig,CT={coulissant:'coulissant',fixe:'fixe',empile:'à empiles'},n=MT.filter(x=>mtMatch(x,c).s=='ok').length,cur=mtCur(c),
v=c.sea?'Mer : <b>'+blE(c.sea)+'</b>':'Mer : <b>non exploitable</b>'+(c.raw?' (« '+blE(c.raw)+' »)':''),w=c.wind||c.dir?' · Vent : <b>'+blE((c.wind?c.wind+' km/h':'')+(c.wind&&c.dir?' ':'')+c.dir)+'</b> (renseigné, sans critère dans les fiches)':' · Vent : non renseigné';

function accSVG(k){const Y=38,O='#e65100',ln=(a,b)=>`<path d="M${a} ${Y}H${b}" stroke="#e8c547" stroke-width="3"/>`,tx=t=>`<text x="180" y="66" text-anchor="middle" font-size="10" fill="currentColor">${t}</text>`,
ri=x=>`<circle cx="${x}" cy="${Y}" r="6" fill="none" stroke="${O}" stroke-width="2.5"/>`,
hk=(x,y)=>`<path d="M${x} ${y}v8q0 7-7 7" stroke="#cfd8dc" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
let o=`<svg viewBox="0 0 360 72" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schéma d’accessoire">`+ln(8,352);
if(k=='sw')o+=ri(168)+ri(192)+`<path d="M174 ${Y}H186" stroke="${O}" stroke-width="3"/>`+tx('émerillon');
if(k=='ssw')o+=ri(164)+`<path d="M170 ${Y}H188" stroke="${O}" stroke-width="3"/><path d="M188 ${Y-7}H204q8 0 8 7t-8 7H188" fill="none" stroke="${O}" stroke-width="2.5"/>`+tx('émerillon à agrafe');
if(k=='roll')o+=ri(160)+ri(200)+`<rect x="168" y="${Y-6}" width="24" height="12" rx="3" fill="${O}"/>`+tx('rolling swivel');
if(k=='bead')o+=`<circle cx="180" cy="${Y}" r="8" fill="${O}" stroke="#fff"/>`+tx('perle');
if(k=='fbead')o+=`<ellipse cx="180" cy="${Y}" rx="11" ry="8" fill="#ffd400" stroke="${O}" stroke-width="2"/>`+tx('perle flottante');
if(k=='lbead')o+=`<circle cx="180" cy="${Y}" r="8" fill="#7CFC00" stroke="#fff" stroke-width="2"/><circle cx="180" cy="${Y}" r="13" fill="none" stroke="#7CFC0088" stroke-width="3"/>`+tx('perle lumineuse');
if(k=='prot')o+=ri(200)+`<circle cx="176" cy="${Y}" r="8" fill="${O}" stroke="#fff"/><path d="M212 ${Y}H230" stroke="#9ed9e8" stroke-width="2"/>`+tx('perle de protection + émerillon');
if(k=='sleeve')o+=`<rect x="150" y="${Y-6}" width="60" height="12" rx="6" fill="${O}" opacity=".85"/>`+tx('sleeve / gaine');
if(k=='stop')o+=`<circle cx="100" cy="${Y}" r="6" fill="none" stroke="#cfd8dc" stroke-width="3"/><path d="M100 ${Y+6}V58" stroke="#cfd8dc" stroke-width="2"/><circle cx="170" cy="${Y}" r="5" fill="#d33"/><path d="M170 ${Y-10}V${Y+10}" stroke="${O}" stroke-width="2.5"/>`+tx('stop');
if(k=='agr')o+=`<path d="M160 ${Y+8}a12 12 0 1 1 28 -4l-6 -2" fill="none" stroke="${O}" stroke-width="2.5"/><circle cx="160" cy="${Y+8}" r="3" fill="${O}"/>`+tx('agrafe');
if(k=='clip')o+=`<path d="M170 ${Y}h20v14h-20z" fill="none" stroke="${O}" stroke-width="2.5"/><path d="M180 ${Y+14}v8" stroke="${O}" stroke-width="2.5"/><polygon points="180,${Y+21} 190,${Y+33} 170,${Y+33}" fill="#5f6a70" transform="translate(0,-6)"/>`+tx('clip de plomb');
if(k=='slider')o+=`<circle cx="180" cy="${Y}" r="8" fill="none" stroke="${O}" stroke-width="3"/><path d="M180 ${Y+8}V56" stroke="${O}" stroke-width="2"/><circle cx="130" cy="${Y}" r="4.5" fill="#d33"/><circle cx="230" cy="${Y}" r="4.5" fill="#d33"/>`+tx('coulisseau entre deux stops');
if(k=='tube')o+=`<rect x="140" y="${Y-5}" width="100" height="10" rx="5" fill="none" stroke="${O}" stroke-width="2.5"/><path d="M240 ${Y}q20 0 26 18" stroke="#9ed9e8" stroke-width="2" fill="none"/>`+tx('tube anti-emmêlement');
if(k=='fl')o+=`<path d="M180 ${Y}q12 0 40 14" stroke="#9ed9e8" stroke-width="2" fill="none"/><ellipse cx="205" cy="${Y+9}" rx="8" ry="5" fill="#ffd400" stroke="${O}" stroke-width="2"/>`+hk(220,Y+14)+tx('flotteur sur empile');
if(k=='elas')o+=hk(180,Y-6)+`<rect x="160" y="${Y+4}" width="30" height="10" rx="5" fill="#c97a5a" stroke="${O}" stroke-width="2"/><path d="M166 ${Y+4}l4 10M174 ${Y+4}l4 10M182 ${Y+4}l4 10" stroke="${O}" stroke-width="1.5"/>`+tx('appât ligaturé');
if(k=='crimp')o+=`<path d="M220 ${Y}q30 0 30 10t-30 10H160" fill="none" stroke="#e8c547" stroke-width="3"/><rect x="190" y="${Y-5}" width="24" height="12" rx="3" fill="${O}"/>`+tx('manchon serti');
if(k=='ring')o+=`<circle cx="180" cy="${Y}" r="9" fill="none" stroke="${O}" stroke-width="3"/><path d="M180 ${Y+9}V56" stroke="#9ed9e8" stroke-width="2"/>`+tx('anneau de liaison');
return o+'</svg>'}
let accCat='',accSel=null,accOk=false;
/* filtres actifs (lecture de l'état existant accCat / accOk / SQ.acc / FV.acc) */
const accAct=()=>{const A=[];if(FV.acc)A.push(['fav','★ Favoris']);if(SQ.acc&&SQ.acc.trim())A.push(['q','Recherche : '+SQ.acc.trim()]);if(accCat)A.push(['k','Catégorie : '+accCat]);if(accOk)A.push(['ok','✓ Compatibles avec mon montage']);return A};
function accList(){const r=S.rig,L=ACC.filter(a=>(!FV.acc||favOn('acc',a.id))&&(!accCat||a.k==accCat)&&(!accOk||a.c.includes(r.mont))&&sqOk('acc',a.n,a.k,a.fn,a.pl,a.ut,a.mo,a.av,a.li)),A=accAct();
return`<p class="note" role="status" aria-live="polite"><b>${L.length}</b> accessoire(s) sur ${ACC.length}${A.length?' · '+A.length+' filtre'+(A.length>1?'s':'')+' actif'+(A.length>1?'s':''):''} <button type="button" class="g sm" data-accgo="1">⚙ Revenir à la configuration</button></p>${A.length?`<div class="spa" aria-label="Filtres actifs"><span class="spal">Filtres actifs :</span>${A.map(x=>`<button type="button" class="pk fl on" data-afx="${x[0]}" aria-label="Retirer le filtre : ${blE(x[1])}" title="Retirer ce filtre">${blE(x[1])} <span aria-hidden="true">✕</span></button>`).join('')}<button type="button" class="g sm spar" data-afx="all">Réinitialiser les filtres</button></div>`:''}${cmLeg()}<div class="pkw">${L.map(x=>sqChip(`data-a="${x.id}"`,x.n+(accCat?'':` <span class="tag">${x.k}</span>`),x.id==accSel,{cx:(cmS('acc',x)||{}).s,fv:favOn('acc',x.id)})).join('')}</div>`+(L.length?'':sqNone('acc','Aucun accessoire ne correspond.'))}
function accInit(){const e=$('acc');if(!e)return;const r=S.rig,cats=[...new Set(ACC.map(a=>a.k))],a=ACC.find(x=>x.id==accSel),row=(t,v)=>`<p><b>${t} :</b> ${v}</p>`,ok=x=>x.c.includes(r.mont);
e.innerHTML=`<h2>Accessoires de montage</h2><p class="note">Fiches indicatives classées par catégorie. Leur utilité dépend du fond, de la houle, du courant et de l’appât ; aucun accessoire n’est obligatoire. Consulter une fiche ne modifie pas votre montage. Le repère ✓ signale les accessoires compatibles avec votre type de montage actuel (<b>${r.mont}</b>).</p>${sqBox('acc','Rechercher un accessoire…')}<div class="pkw">${sqChip('data-k=""','Tous',!accCat,{f:1})}${cats.map(c=>sqChip(`data-k="${c}"`,c,c==accCat,{f:1})).join('')}${sqChip('data-ok="1"','✓ Compatibles avec mon montage',accOk,{f:1})}</div><div class="sl">${accList()}</div>`+sqBar('acc',a&&a.n)+(a?`<div class="mtd fc-sel" style="margin-top:10px"><div class="mts">${accSVG(a.v)}</div><div><div class="fvh"><h3>${a.n} <span class="tag">${a.k}</span></h3>${favBtn('acc',a.id,a.n)}</div>${cmBox('acc',a)}${fcSum('acc',a.id)}${fcLv2('acc',a.id)}<div class="fc-act">${fcBtn('acc',a.id)}</div></div></div>`:'<p class="note" style="margin-top:8px">Sélectionnez un accessoire pour afficher sa fiche.</p>')+fcPanel('acc');
e.onclick=ev=>{const t=ev.target.closest('button');if(!t)return;const d=t.dataset;if(d.sx!=null)return;
if(d.accgo!=null){vfGo('mont','bl_mont');return}
if(d.afx){const k=d.afx;if(k=='all'){accCat='';accOk=false;SQ.acc='';FV.acc=0}else if(k=='q')SQ.acc='';else if(k=='fav')FV.acc=0;else if(k=='k')accCat='';else if(k=='ok')accOk=false;accInit();return}
if(d.ok!=null){accOk=!accOk;if(accSel&&!ACC.some(x=>x.id==accSel&&(!accOk||x.c.includes(S.rig.mont))))accSel=null;accInit();return}
if(d.k!=null&&d.a==null){accCat=d.k;if(accSel&&!ACC.some(x=>x.id==accSel&&(!accCat||x.k==accCat)))accSel=null;accInit();return}
if(d.a){accSel=accSel==d.a?null:d.a;if(accSel)recordRecent(accSel,'acc');accInit();if(accSel)sqGo('acc')}}}
SQP.acc={root:'acc',up:()=>sqUp('acc',accList),clr(){accSel=null},rst(){accCat='';accOk=false},init:()=>accInit()};
