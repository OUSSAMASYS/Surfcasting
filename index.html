<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Surfcasting Tunisie</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1c2a33;--mut:#5d6b73;--pri:#0b6e8a;--line:#d9d3c5;--bad:#b3261e;--sea:#e6f1f4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181d;--card:#182329;--ink:#e8eef0;--mut:#98a8af;--pri:#4fc3de;--line:#2b3a42;--bad:#ff8a80;--sea:#12262d}}
:root[data-theme="dark"]{--bg:#10181d;--card:#182329;--ink:#e8eef0;--mut:#98a8af;--pri:#4fc3de;--line:#2b3a42;--bad:#ff8a80;--sea:#12262d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{padding:16px;background:var(--pri);color:#fff}header h1{margin:0;font:700 20px Georgia,serif}header p{margin:2px 0 0;opacity:.85;font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:none;border:0;background:none;color:var(--mut);padding:8px 14px;border-radius:20px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
nav button.on{background:var(--pri);color:#fff}
main{max-width:1000px;margin:auto;padding:14px}section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mut);font-weight:600}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin-top:3px}
button.b{background:var(--pri);color:#fff;border:0;padding:9px 16px;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
button.g{background:none;border:1px solid var(--line);color:var(--ink);padding:5px 10px;border-radius:8px;cursor:pointer}
h2{font:700 17px Georgia,serif;margin:4px 0 10px}h3{margin:0;font-size:16px}
.sp{display:grid;grid-template-columns:150px 1fr;gap:12px}@media(max-width:560px){.sp{grid-template-columns:1fr}}
.tag{display:inline-block;background:var(--sea);border-radius:10px;padding:1px 8px;font-size:12px;margin:2px 2px 0 0}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin:6px 0}.months i{font:normal 9px/16px sans-serif;text-align:center;border-radius:3px;background:var(--line);color:var(--mut)}.months i.y{background:var(--pri);color:var(--on-pri)}
.rigbox{background:var(--sea);border-radius:10px;padding:6px;overflow-x:auto}.rigbox svg{min-width:560px;width:100%;height:auto;display:block}
.ble{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}.ble.off{opacity:.65}.ble h3{font-size:14px}.blg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:6px}.ble input[type=checkbox]{width:auto;margin:0;padding:0}.ble .ro{font-size:13px;padding:8px 0}.blw{font-size:13px;margin:2px 0}.blw.w{color:var(--bad)}.blw.i{color:var(--mut)}
.bad{color:var(--bad);font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:5px;text-align:left}
.catch{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}.catch img{width:90px;height:60px;object-fit:cover;border-radius:6px}
.note{font-size:12px;color:var(--mut)}
.rigbox svg.rigsvg{min-width:0;width:100%;max-width:560px;margin:0 auto}
.rigsvg text{font-family:inherit}.rigsvg .rg-n,.rigsvg .rg-d{fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3.5px;stroke-linejoin:round}
.rigsvg .rg-n{font-size:14px;font-weight:700}.rigsvg .rg-d{font-size:12.5px}.rigsvg .rg-m{font-size:12px;fill:var(--mut)}
.rigsvg .rg-l{stroke:var(--mut);stroke-width:1;fill:none}.rigsvg .rg-dot{fill:var(--mut)}
.rigsvg .rg-ar{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rigsvg .rg-nd{fill:#fff;stroke:#37474f;stroke-width:1.9}
.mts{background:var(--sea);border-radius:10px;padding:6px}.mts svg{width:100%;max-width:440px;height:auto;display:block;margin:auto}.mtd{display:grid;grid-template-columns:minmax(240px,440px) 1fr;gap:12px}@media(max-width:700px){.mtd{grid-template-columns:1fr}}.mtd p{margin:0 0 6px;font-size:13px}.mtc button.b.on{outline:2px solid var(--ink)}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;color:#000}.card{break-inside:avoid;page-break-inside:avoid;border-color:#bbb}main{padding:0}}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ctl input,.ctl select{width:auto;margin:0}
#el{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}#el .card{margin:0;display:flex;flex-direction:column;gap:6px}
.pic{background:var(--sea);border-radius:10px;height:140px;display:flex;align-items:center;justify-content:center;overflow:hidden}.pic svg,.pic img{max-height:130px;width:auto;max-width:92%}
.on-s{background:#177a42;color:#fff}.star{font-size:16px;line-height:1;padding:3px 7px}.fav-on{border-color:#e0a800}.warn{background:#b3261e;color:#fff}.months i.now{outline:2px solid var(--ink)}
.sm{font-size:12px;padding:4px 8px}
.hks{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:12px}@media(max-width:620px){.hks{grid-template-columns:1fr}}.hk{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}.hk>div{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:6px}.hk>div.cur{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}.hk svg,.hk1 svg{width:100%;max-width:320px;height:auto;display:block;background:var(--sea);border-radius:8px}details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--pri);margin:4px 0}

/* ===== Hiérarchie visuelle & lisibilité (surcouche CSS uniquement) ===== */
:root{--hdr:#0b5f78;--on-pri:#fff;--line2:#c4bdab;--hover:#eef3f4;--shadow:0 1px 2px rgba(28,42,51,.06);--gut:16px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--hdr:#12313b;--on-pri:#06222b;--line:#31424b;--line2:#465962;--hover:#1e2f37;--shadow:none}}
:root[data-theme="dark"]{--hdr:#12313b;--on-pri:#06222b;--line:#31424b;--line2:#465962;--hover:#1e2f37;--shadow:none}
body{line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
main{min-width:0}
/* En-tête */
header{background:var(--hdr);padding:20px max(var(--gut),calc((100% - 1000px)/2 + var(--gut))) 18px;border-bottom:1px solid rgba(255,255,255,.12)}
header h1{font:700 22px/1.25 Georgia,serif;letter-spacing:.005em}
header p{margin:4px 0 0;opacity:.88;font-size:13px}
header .row.noprint{gap:8px;margin-top:14px!important}
header .g.sm{min-height:34px;border-radius:8px;transition:background .15s}
header .g.sm:hover{background:rgba(255,255,255,.28)!important}
.saveSt{font-size:12px;line-height:1.3;padding:4px 9px;border-radius:999px;color:rgba(255,255,255,.92);background:rgba(255,255,255,.1);cursor:pointer;margin-left:auto;white-space:nowrap}
.saveSt[data-k="warn"]{background:#ffd966;color:#3b2f00;font-weight:600}
.saveSt:focus-visible{outline:2px solid #fff;outline-offset:2px}
#gsearch{background:var(--gsbg)!important;color:var(--gsink)!important;border:1px solid var(--gsbd);min-height:42px;padding:10px 12px;font-size:15px}
#gsearch::placeholder{color:var(--gsph)}
#gsearchResults{box-shadow:0 10px 28px rgba(0,0,0,.22);border-color:var(--line2)}
#gsearchResults{padding:0;max-height:min(70vh,480px);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;color:var(--ink)}
.gs-h{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;gap:8px;padding:6px 12px;font-size:12px;font-weight:700;background:var(--sea);color:var(--ink);border-bottom:1px solid var(--line)}
.gs-r{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:48px;min-width:0;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line);-webkit-tap-highlight-color:transparent}
.gs-r:hover,.gs-r.act{background:var(--hover)}.gs-r.act{box-shadow:inset 3px 0 0 var(--pri)}
.gs-t{display:flex;align-items:center;gap:8px;min-width:0}
.gs-t b{flex:0 1 auto;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gs-k{flex:none;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--sea);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.gs-s{font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gs-r mark{background:var(--mkbg);color:var(--mkink);border-radius:3px;padding:0 1px}
.gs-more{align-items:center;color:var(--pri);font-weight:600;font-size:13px}
.gs-none{padding:14px 12px}
/* Navigation */
nav{padding:8px max(8px,calc((100% - 1000px)/2 + 8px));gap:6px;border-bottom:1px solid var(--line2)}
nav button{min-height:40px;border-radius:8px;padding:8px 16px;white-space:nowrap;transition:background .15s,color .15s}
nav button:hover{background:var(--hover);color:var(--ink)}
nav button.on,nav button.on:hover{background:var(--pri);color:var(--on-pri);font-weight:700}
/* Titres */
h2{font:700 19px/1.3 Georgia,serif;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line);letter-spacing:.003em}
h2 .note{font-family:system-ui,Segoe UI,Roboto,sans-serif}
h3{font:650 15px/1.35 system-ui,Segoe UI,Roboto,sans-serif}
h2+.note,h2+p.note{margin:-4px 0 14px}
/* Conteneurs */
main{padding:22px var(--gut) 48px}
.card{padding:18px;margin-bottom:18px;border-radius:10px;border-color:var(--line);box-shadow:var(--shadow)}
.card .card{box-shadow:none}
#el{gap:16px}#el .card{padding:14px;transition:border-color .15s}#el .card:hover{border-color:var(--line2)}
.grid{gap:12px 14px}.row{gap:10px}
.sp{gap:16px}
.rigbox,.mts,.pic{border:1px solid var(--line);padding:10px}
.pic{padding:6px}
.ble{padding:12px 14px;margin-bottom:10px;border-radius:8px}
.blg{gap:10px 12px;margin-top:10px}
.hk{gap:14px}.hk>div{padding:14px;border-radius:10px;gap:8px}
.hk>div.cur{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.hks,.mtd{gap:18px}
.catch{padding:12px 0;gap:14px}
.catch:last-child{border-bottom:0}
details{margin:6px 0}details summary{padding:4px 0;min-height:28px}
/* Texte secondaire & technique */
.note{font-size:12.5px;line-height:1.5}
.tag{padding:2px 9px;font-weight:600;border:1px solid var(--line);color:var(--ink)}
.tag.warn,.tag.on-s{border-color:transparent;color:#fff}
.months{gap:3px}.months i{font-size:10px}
.blw{font-size:13px}
/* Tableaux */
table{font-size:13.5px}
th{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.02em;text-transform:uppercase;background:var(--hover)}
td,th{padding:8px 10px;vertical-align:top;overflow-wrap:break-word}
tr:last-child td{border-bottom:0}
/* Formulaires */
label{font-size:12px;font-weight:600;letter-spacing:.02em;margin-bottom:2px}
input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=file]),select,textarea{min-height:40px;padding:9px 10px;border-color:var(--line2);transition:border-color .15s}
textarea{min-height:76px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{border-color:var(--pri)}
/* Boutons : principal / secondaire */
button.b{min-height:40px;padding:9px 18px;font-weight:700;color:var(--on-pri);transition:filter .15s}
button.b:hover{filter:brightness(1.1)}
button.b.sm{min-height:32px;padding:5px 12px}
button.g{min-height:36px;padding:6px 12px;color:var(--ink);border-color:var(--line2);transition:background .15s}
button.g:hover{background:var(--hover)}
button.g.sm{min-height:32px}
button.g.star{min-height:32px;min-width:34px}
button:disabled{opacity:.5;cursor:not-allowed}
/* Mobile & petits écrans */
@media(max-width:700px){main{padding:16px 12px 40px}.card{padding:14px;margin-bottom:14px}h2{font-size:18px}}
@media(max-width:560px){:root{--gut:12px}header h1{font-size:20px}nav button{padding:8px 12px}input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=file]),select,textarea{font-size:16px}td,th{padding:7px 6px}}
@media(max-width:420px){.hk,#el,.grid,.blg{grid-template-columns:minmax(0,1fr)}.catch{grid-template-columns:72px 1fr}.catch img{width:72px;height:50px}.hks,.mtd{grid-template-columns:minmax(0,1fr)}}
@media print{.card{box-shadow:none}th{background:none}h2{border-bottom-color:#bbb}}

/* ===== Navigation principale : onglet actif net, cibles tactiles, sans défilement horizontal ===== */
nav{gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--card);box-shadow:0 1px 0 var(--line2),var(--shadow)}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 14px;border-radius:8px 8px 0 0;color:var(--mut);font-weight:600;position:relative;box-shadow:inset 0 -3px 0 transparent;-webkit-tap-highlight-color:transparent}
nav button .ni{font-size:17px;line-height:1;flex:none;filter:grayscale(.55);opacity:.85}
nav button .nl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button:hover{background:var(--hover);color:var(--ink)}
nav button.on,nav button.on:hover{background:var(--sea);color:var(--pri);font-weight:700;box-shadow:inset 0 -3px 0 var(--pri)}
nav button.on .ni{filter:none;opacity:1}
nav button:focus-visible{outline:2px solid var(--pri);outline-offset:-3px}
@media(max-width:560px){
nav{padding:6px 6px 0;gap:2px}
nav button{flex-direction:column;gap:2px;min-height:54px;padding:6px 2px 7px;font-size:12px;border-radius:8px 8px 0 0}
nav button .ni{font-size:19px}
}
@media(max-width:340px){nav button{font-size:11px}}
@media(prefers-reduced-motion:reduce){nav button{transition:none}}

/* ===== Parcours de conception du bas de ligne (6 étapes, surcouche CSS) ===== */
:root{--wzok:#177a42;--wzonok:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--wzok:#4cc38a;--wzonok:#06222b}}
:root[data-theme="dark"]{--wzok:#4cc38a;--wzonok:#06222b}
#wz .wzh{scroll-margin-top:68px}
#wzn{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:0 0 14px}
.wzb{display:flex;align-items:center;gap:8px;min-height:52px;padding:8px 10px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;text-align:left;cursor:pointer;min-width:0;-webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s}
.wzb:hover{background:var(--hover)}
.wzb.on{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri);background:var(--sea)}
.wzx,.wzx2{flex:none;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 13px system-ui,sans-serif;background:var(--line);color:var(--ink)}
.wzb.on .wzx{background:var(--pri);color:var(--on-pri)}
.wzb.ok .wzx,.wzx2.ok{background:var(--wzok);color:var(--wzonok)}
.wzt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.wzt b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wzt i{font:normal 11px system-ui,sans-serif;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wzk{font:700 12px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--pri)}
.wzti{font:700 18px/1.3 Georgia,serif;margin:2px 0 4px}
.wzc{display:inline-block;padding:2px 10px;margin:4px 6px 0 0;border-radius:12px;border:1px solid var(--line2);font:700 12px system-ui,sans-serif;color:var(--ink)}
.wzc.cur{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.wzc.ok{background:var(--wzok);border-color:transparent;color:var(--wzonok)}
.wzf{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.wzf button{min-height:44px}
.wzl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.wzl:last-of-type{border-bottom:0}.wzl b{flex:1;min-width:0}
/* Une seule étape affichée à la fois ; les contenus existants restent dans le DOM */
#wz[data-s="1"] [data-st]:not([data-st~="1"]),#wz[data-s="2"] [data-st]:not([data-st~="2"]),#wz[data-s="3"] [data-st]:not([data-st~="3"]),#wz[data-s="4"] [data-st]:not([data-st~="4"]),#wz[data-s="5"] [data-st]:not([data-st~="5"]),#wz[data-s="6"] [data-st]:not([data-st~="6"]){display:none}
/* Sections de la configuration détaillée (#bld) réparties par étape */
#wz[data-s="2"] .ble:not([data-k="corps"]):not([data-k="sh"]){display:none}
#wz[data-s="3"] .ble:not([data-k="em"]):not([data-k="pe"]):not([data-k="co"]):not([data-k="ag"]){display:none}
#wz[data-s="4"] .ble:not([data-k="cm"]):not([data-k="ep"]):not([data-k="pl"]){display:none}
#wz[data-s="5"] .ble:not([data-k="hk"]){display:none}
@media(max-width:800px){#wzn{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){#wzn{grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}.wzb{justify-content:center;padding:6px 0;min-height:48px}.wzt{display:none}.wzf .b,.wzf .g{flex:1 1 140px}}
@media(prefers-reduced-motion:reduce){.wzb{transition:none}}
@media print{#wzn,.wzf{display:none}}

/* ===== Édition du montage : principal / avancé, résumé, regroupement (surcouche) ===== */
#wz{min-width:0}
#wz:not([data-adv="1"]) .adv,#wz:not([data-adv="1"]) .ble.nomain,#wz:not([data-adv="1"]) .ble.na{display:none}
#wz .card.wzs,#wz .card.wzempty{display:none!important}
#wz[data-s="6"] .wzadvrow{display:none}
.wzadvrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 0}
.wzadvrow .g{min-height:44px;padding:8px 14px;font-weight:600}
.wzadv[aria-expanded="true"]{border-color:var(--pri);color:var(--pri)}
.rsum{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rsc{display:flex;flex-direction:column;align-items:flex-start;min-height:44px;min-width:0;max-width:100%;padding:6px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rsc small{font-size:11px;color:var(--mut);letter-spacing:.02em;line-height:1.3}
.rsc b{font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}
.rsc.cur{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri);background:var(--sea)}
#wz .card[data-st] h2{font-size:16px;border-bottom:0;padding-bottom:0;margin-bottom:10px}
#bldc h2+.note{margin:-4px 0 6px}
#wz .ble{border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 0 6px;margin:0}
#wz .ble:not(.off){box-shadow:inset 3px 0 0 var(--pri);padding-left:12px}
#wz .ble.off{opacity:.8;padding-left:0}
#wz .ble h3 label{min-height:44px;cursor:pointer}
#wz .ble input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri)}
#wz .blg{gap:10px 12px;margin-top:4px}
#wz .blg .adv{order:2}
#wz .blg .ro{grid-column:1/-1;padding:4px 0}

/* ===== Micro-interactions (retours visuels courts, transform/opacity, sans animation permanente) ===== */
@keyframes fxPop{0%{transform:scale(.92)}55%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes fxFade{from{opacity:.55}to{opacity:1}}

@keyframes fxSave{from{background-color:color-mix(in srgb,var(--vK) 55%,transparent)}}

@keyframes fxNew{from{opacity:.45;transform:translateY(-3px)}to{opacity:1;transform:none}}
@keyframes fxToast{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fx-pop{animation:fxPop .2s ease-out}

.fx-warn{animation:fxWarn .7s ease-out}

.scToast.sct-in{animation:fxToast .2s ease-out}
.pk,.wzb,button.b,button.g,#rating button,nav button{transition-property:background-color,border-color,color,box-shadow,filter,transform;transition-duration:.15s}

.scToast.sct-in{animation:fxFade .12s}

.pk,.wzb,button.b,button.g,#rating button,nav button,#bld .ble{transition-duration:.01s}

/* ===== Cohérence des composants UI (passe 24) : surcouche finale, apparence uniquement ===== */
:root{--r-ctl:8px;--r-box:10px;--r-lg:12px;--r-pill:999px;--ctl-h:40px;--ctl-h-sm:34px;--bar:5px;--ring:0 0 0 1px var(--pri);--ease:.15s;--fs-s:12.5px;--fs-m:14px;--fs-l:15px;--pad-box:14px;--dis:.5;--shadow-pop:0 8px 28px rgba(0,0,0,.22)}

button.b:active,button.g:active{transform:scale(.97)}

/* repliées : seuls les blocs essentiels restent affichés (le corps du montage seulement s'il est actif ou obligatoire) */

/* ===== 28 — Système UI cohérent : passe de convergence finale (apparence uniquement, aucune logique ni donnée modifiée) ===== */
:root{--off:.75}
/* Éléments d'une liste dans un panneau (maillon, bloc technique, figure de rapport) : même rayon */
#tdc .tdb,.rp-fig{border-radius:var(--r-box)}
.rp-st{border-radius:var(--r-ctl)}
/* Titres d'éléments de carte : même taille */
.ble h3,#wz[data-q="1"] .ble h3,#tdc .tdbh b{font-size:var(--fs-l)}
/* État inactif : même opacité, même trait pointillé */
.ble.off,#wz .ble.off,#wz[data-q="1"] .ble.ble.off,#tdc .tdb.off{opacity:var(--off);border-style:dashed}
/* Choix rapides : même hauteur de contrôle pour les pastilles */
.pk.fl{min-height:var(--ctl-h)}
/* États désactivés : mêmes que les boutons */
.qm:disabled,.rsc:disabled,.rgi:disabled,.wzb:disabled,.pk:disabled{opacity:var(--dis);cursor:not-allowed;box-shadow:none;transform:none}
/* Focus clavier unique pour les contrôles restants */
.qm:focus-visible,.rgi:focus-visible,.sbar:focus-visible,label.g:focus-within{outline:2px solid var(--pri);outline-offset:2px}
/* Sélection : même langage pour les choix de montage */
.qm.on,.rgi.on{border-color:var(--pri);box-shadow:var(--ring);background:var(--sea)}
.rgi.on{color:var(--pri)}
/* Infobulle : rayon de contrôle */
.rgt{border-radius:var(--r-ctl)}
@media print{.ble.off,.tdb.off{opacity:1}}
/* ===== Navigation : améliorations tactiles (composant nav existant) ===== */

/* ===== Recherche globale : filtres de catégories ===== */

/* Résumé intelligent des espèces (présentation seule, lit les données de l'espèce) */
.sps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:6px;margin:8px 0}

/* Mode « Fiche rapide » (présentation seule ; lit exactement les mêmes données que la fiche complète) */
.spqb{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:46px;margin:8px 0 0;font-weight:700;border:1.5px solid var(--pri);color:var(--pri);background:var(--sea);-webkit-tap-highlight-color:transparent}

/* Comparaison d'espèces (présentation seule ; lit SP, mémorise uniquement des identifiants) */

.std{margin-bottom:10px}
#offB{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4)}#offB[hidden]{display:none}
.phw{display:block;text-align:center}.phn{display:block;font-size:11.5px;color:var(--mut);line-height:1.3;margin-top:2px}.pic .phw{display:flex;flex-direction:column;align-items:center;max-width:92%}.pic .phw svg{max-height:100px}

/* ===== Finitions responsive smartphone 320–430 px (surcouche CSS, aucune fonctionnalité modifiée) ===== */
@media(pointer:coarse),(max-width:560px){
button.g.star,button.g.fvb{min-width:44px;flex:0 0 auto}
button.vs{min-width:44px}
#t-log #rating>button{min-width:44px}
#dbd .dbt,#t-rig #dbd button.vs{min-height:44px}
.pk{min-width:44px}
input[type=file]{width:100%;max-width:100%;min-height:44px;font-size:14px}
input[type=file]::file-selector-button{min-height:36px;margin-right:10px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-weight:600}
}
@media(max-width:560px){
/* Notation : 5 étoiles de 44 px, le bouton d'effacement passe à la ligne si besoin */
#t-log #rating{flex-wrap:wrap}
#t-log #rating>button{flex:0 0 auto}
}
@media(max-width:420px){
/* En-tête : actions sur 2 colonnes au lieu d'une pile de 4 lignes (le champ de recherche reste pleine largeur) */
header .row.noprint:not(#gsearchWrap){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
header .row.noprint:not(#gsearchWrap)>button{width:auto;min-width:0;flex:none;white-space:normal;line-height:1.2;padding:6px 8px;font-size:12.5px}
header .row.noprint:not(#gsearchWrap)>.saveSt{align-self:center;text-align:center;margin:0}
/* Sélecteur Rapide / Expert : libellés sur 2 lignes maximum */
.psw button{padding:6px 6px;font-size:13px;line-height:1.25;overflow-wrap:anywhere}
}
@media(max-width:380px){
/* Barre d'étapes : le libellé de progression passe sur sa propre ligne (plus de chevauchement avec les boutons) */
#wz .wzf{flex-wrap:wrap;gap:6px 8px}
#wz .wzf .wzp{order:-1;flex:1 1 100%}
#wz .wzf>button{flex:1 1 0;min-width:44px;padding-left:4px;padding-right:4px}
}
/* Clavier virtuel ouvert / faible hauteur en portrait : barres collantes libérées pour laisser la place au champ actif */
@media(max-width:560px) and (max-height:520px) and (orientation:portrait){
.wzf,#wz .wzf{position:static!important;border-top:0!important;padding-bottom:0!important}
#t-rig>#dbd.dbdc{position:static}
}
/* ===== v78 — Mode paysage : adaptation à la largeur ET à la hauteur réelles (aucune détection d'appareil) ===== */
/* Faible hauteur (smartphones en paysage) : navigation non fixe, cartes et marges compactes */
@media screen and (orientation:landscape) and (max-height:500px){
:root{--navh:0px;--ctl-h:40px;--ctl-h-sm:36px;--pad-box:10px}
@media(pointer:coarse){:root{--ctl-h:44px;--ctl-h-sm:44px}}
nav{position:static;padding-top:4px;padding-bottom:4px;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
nav button{min-height:44px}
main,.card{scroll-margin-top:8px}
.card{padding:10px 12px;margin-bottom:8px}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#wz .wzf,.qbar{position:static}
#wz>#dbd,#dbd.dbdc{position:static;max-height:none}
#xpc .xpnav{position:static}
.ntm,.spqm{max-height:calc(100dvh - 12px);padding-top:10px;padding-bottom:10px}
.pic{height:96px}.pic svg,.pic img{max-height:88px}
.scToast,#scNt{bottom:8px}
}
/* Paysage large ≥600px de large : configurateur schéma | réglages, journal en 2 colonnes, espèces en grille compacte */
@media screen and (orientation:landscape) and (min-width:600px) and (max-width:999px){
#wz{display:grid;grid-template-columns:minmax(260px,44%) minmax(0,1fr);column-gap:12px;align-items:start}
#wz>*{grid-column:2;min-width:0}
#wz>#wzh{grid-row:1}
#wz>#rvw{grid-column:1;grid-row:1/span 60;position:sticky;top:8px;z-index:3;align-self:start;max-height:calc(100dvh - 16px);overflow:auto;overscroll-behavior:contain;border-top:4px solid var(--pri)}
#wz>#dbd{grid-column:2;grid-row:auto;position:static;max-height:none;overflow:visible}
#wz .rigbox{overflow-x:auto}
#wz .rigbox svg.rigsvg{min-width:0;width:100%;max-width:none;height:auto;max-height:calc(100dvh - 120px)}
#wz .grid,#wz .blg{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px 12px}
#wz .hk{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
html.kbo #wz>#rvw{position:static;max-height:none}
#el{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
#t-log.on{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px;align-items:start}
#t-log>.card:nth-child(1){grid-column:1;grid-row:1}
#t-log>.card:nth-child(2){grid-column:2;grid-row:1}
#t-log>.card:nth-child(3){grid-column:1;grid-row:2}
#t-log>.card:nth-child(5){grid-column:2;grid-row:2}
#t-log>.card:nth-child(4){grid-column:1/-1;grid-row:3}
#t-log .grid>label:has(#cs),#t-log .grid>label:has(#cp){grid-column:1/-1}
#t-log .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.ntm{width:min(560px,100%)}
}
/* Tablette paysage (hauteur confortable, largeur < desktop) : barre de navigation conservée, schéma plus grand */
@media screen and (orientation:landscape) and (min-height:501px) and (max-width:999px){
#wz>#rvw{top:calc(var(--navh) + 8px);max-height:calc(100dvh - var(--navh) - 16px)}
#wz .rigbox svg.rigsvg{max-height:calc(100dvh - var(--navh) - 150px)}
}
/* Desktop / tablette large en faible hauteur : le schéma ne dépasse jamais l'écran */
@media screen and (orientation:landscape) and (min-width:1000px) and (max-height:700px){
#wz>#rvw{max-height:calc(100dvh - var(--navh) - 16px)}
#wz #rvw .rigbox svg.rigsvg{max-height:calc(100dvh - var(--navh) - 140px)}
}

/* ===== v79 — Desktop large (≥1600 px) : surcouche CSS seule, aucune logique ni donnée modifiée ===== */
/* Largeur utile progressive (1440 → 1600 → 1760 → 1960), marges latérales proportionnées ; header, nav et main restent alignés via --wmax / --gut */
@media(min-width:1600px){
:root{--wmax:1600px;--gut:24px}
#el{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
#wz .grid,#wz .blg{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
#wz .hk{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.hk,.mtg,.simg{gap:14px}
.mtg{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
/* Lignes de texte confortables : paragraphes de carte limités à ~80 caractères */
.card>p.note,.card>div.note,.card>p:not(.row):not(.noprint){max-width:80ch}
.spd>.note,.spd2 .note,.spsec .note{max-width:90ch}
/* Recherche : champs limités, pas d'étirement sur toute la largeur */
#t-esp .ctl>#q{max-width:640px}
#gsearchWrap{max-width:760px;width:100%}
/* Statistiques : indicateurs de taille raisonnable */
.stk{grid-template-columns:repeat(auto-fit,minmax(150px,260px))}
.stg{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
}
@media(min-width:1920px){
:root{--wmax:1760px}
#wz{grid-template-columns:clamp(500px,34%,640px) minmax(0,1fr);column-gap:24px}
#el{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
#wz .hk{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
#wz #rvw .rigbox svg.rigsvg{margin:0 auto}
#t-log.on{column-gap:24px}
}
@media(min-width:2400px){
:root{--wmax:1960px;--gut:32px}
#wz{grid-template-columns:clamp(560px,32%,720px) minmax(0,1fr)}
#el{grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:20px}
.stk{grid-template-columns:repeat(auto-fit,minmax(150px,280px))}
}

/* ===== v80 — Navigation clavier PC : surcouche (focus, liens d'évitement, aide). Aucune logique métier. ===== */
.skipw{position:absolute;left:0;top:0;z-index:100}
.skipl{position:absolute;left:-9999px;top:8px;min-height:0;padding:10px 16px;border-radius:8px;background:var(--card);color:var(--ink);border:2px solid var(--pri);font:700 14px/1.2 system-ui,sans-serif;white-space:nowrap;cursor:pointer}
.skipl:focus,.skipl:focus-visible{left:8px;outline:3px solid var(--pri);outline-offset:2px}
main:focus,main:focus-visible{outline:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.hcm:focus-visible,.cmt:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
header :focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px rgba(0,0,0,.4)}
.kbhov{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(0,0,0,.5)}
.kbhp{box-sizing:border-box;width:100%;max-width:580px;max-height:calc(100vh - 24px);overflow:auto;padding:16px 18px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.kbhp .kbhh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.kbhp h2{margin:0;font-size:18px}
.kbhp h3{margin:14px 0 4px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.kbhp table{width:100%;border-collapse:collapse;font-size:14px}
.kbhp td{padding:6px 0;vertical-align:top;border-bottom:1px solid var(--line)}
.kbhp td:first-child{white-space:nowrap;padding-right:14px}
.kbhp kbd{font:600 12px ui-monospace,Consolas,monospace;padding:2px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--sea);color:var(--ink)}
.kbhp .kbhn{margin:12px 0 0;font-size:13px;color:var(--mut)}
@media(hover:none) and (pointer:coarse){#kbHelpBtn{display:none}}
@media print{.kbhov,.skipw,#kbHelpBtn{display:none!important}}

/* v83 — Accessibilité : correctifs ciblés (WCAG 2.2 AA) */
:root{--ctl:#857e6d}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ctl:#6b7f88}}
:root[data-theme="dark"]{--ctl:#6b7f88}
/* 1.4.11 : bordure des champs et boutons secondaires ≥ 3:1 */
input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=file]),select,textarea,button.g{border-color:var(--ctl)}
/* 1.4.3 : mois hors saison (texte 9 px) : encre pleine sur fond neutre */
.months i:not(.y){color:var(--ink)}
/* 2.3.3 / préférence système : filet de sécurité pour toutes les transitions et le défilement */
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition-duration:.01ms!important;transition-delay:0s!important}}
/* Contraste renforcé / couleurs forcées : le focus reste visible */
@media(forced-colors:active){:focus-visible{outline:2px solid Highlight!important}}

/* v84 — Mode sombre : harmonisation (surcouche ; variables existantes réutilisées, mode clair inchangé) */
:root{color-scheme:light;--gsbg:#fff;--gsink:#111;--gsph:#5d6b73;--gsbd:transparent;--mkbg:#ffe066;--mkink:#1c2a33;--mkbg2:#ffe08a;--mkink2:#111}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--gsbg:var(--card);--gsink:var(--ink);--gsph:var(--mut);--gsbd:var(--line2);--mkbg:rgba(255,207,77,.32);--mkink:var(--ink);--mkbg2:rgba(255,207,77,.32);--mkink2:var(--ink)}
:root:not([data-theme="light"]) svg [fill="#5f6a70"]{fill:#9fb0b8}}
:root[data-theme="dark"]{color-scheme:dark;--gsbg:var(--card);--gsink:var(--ink);--gsph:var(--mut);--gsbd:var(--line2);--mkbg:rgba(255,207,77,.32);--mkink:var(--ink);--mkbg2:rgba(255,207,77,.32);--mkink2:var(--ink)}
:root[data-theme="dark"] svg [fill="#5f6a70"]{fill:#9fb0b8}
@media print{:root{color-scheme:light!important}}
/* ===== 59 — Compatibilité navigateurs (replis ciblés, aucun changement d'apparence sur navigateurs récents) ===== */
button{font-family:inherit}
@supports not (background:color-mix(in srgb,red 10%,blue)){
button.g[data-x],button.g[data-hx],#cols button.g[data-d]{border-color:var(--dng)}
button.g[data-x]:hover,button.g[data-hx]:hover,#cols button.g[data-d]:hover{background:var(--hover)}
}

/* ===== 60 — Qualité des rapports PDF : impression A4 (champs absents masqués, tableaux non coupés, niveaux de gris) ===== */
@media print{
#t-rep .rp-hd{border-bottom:1.5pt solid #000}

#t-rep .rp-kv3{grid-template-columns:repeat(auto-fill,minmax(52mm,1fr))}
#t-rep .rp-kv.sm{grid-template-columns:repeat(auto-fill,minmax(24mm,1fr))}
.rp-kv dd{overflow-wrap:anywhere;word-break:break-word}

.rp-t th:nth-child(1),.rp-t td.c{width:27%}.rp-t th:nth-child(2){width:25%}.rp-t th.u,.rp-t td.u{width:15%}
.rp-t tbody{break-inside:avoid;page-break-inside:avoid}

}
@media print and (monochrome){.rp-st.er,.rp-st.wa,.rp-st.ok{color:#000}.rp-v b.e,.rp-v b.w,.rp-v b.i{color:#000}}

/* ===== 61 — Connexion espèces ↔ montages (présentation seule ; variables existantes, clair/sombre) ===== */
.spmt{margin:8px 0;border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:6px 10px 8px;background:var(--card)}
.spmt .spl{font-weight:800;font-size:14px;color:var(--pri);margin:0 0 4px}
.spml>.spmr:first-child{border-top:0}
.spmr{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);min-width:0}
.spmi{flex:1;min-width:0;font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.spmi>b{font-size:13.5px}
.spmw,.spmc{display:block;color:var(--mut);font-size:12.5px}
.spmw b{color:var(--ink)}
.spmr .g{flex:none;min-height:40px;font-weight:600;color:var(--pri);border-color:var(--pri)}
.spmt details{margin:4px 0 0}
.spmt .spmbk{margin:0 0 6px}
.mtsp{margin:6px 0 8px;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;background:var(--bg)}
.mtsp .row{gap:6px}
@media(pointer:coarse){.spmr .g{min-height:44px}}
@media(max-width:520px){.spmr{flex-direction:column;gap:6px}.spmr .g{width:100%}}
@media print{.spmr .g,.mtsp button,.spmbk{display:none}}
/* relation espèces ↔ appâts */
button.tagb{font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--pri);background:var(--card);border:1px solid var(--pri);border-radius:var(--r-pill,999px);padding:3px 10px;min-height:32px;margin:2px 4px 0 0}
button.tagb:hover,button.tagb:focus-visible,button.tagb[aria-pressed="true"]{background:var(--pri);color:var(--on-pri)}
.spl .note{font-weight:400;margin-left:4px}
.bxctx{margin:8px 0;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;background:var(--bg)}
.bxctx p{margin:0 0 6px}.bxctx .row{gap:6px}
.bxm{color:var(--pri);font-weight:800}
.bxsug{grid-column:1/-1;margin:0 0 4px}

/* 64 — conditions ↔ montages */
.mcp{border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;background:var(--bg)}.mcp p{margin:0 0 6px}
.mcs{font-size:12.5px;line-height:1.35;margin:6px 0 0;padding:4px 8px;border-left:4px solid var(--line);border-radius:4px;color:var(--ink)}
.mcs-ok{border-left-color:var(--vK)}.mcs-no{border-left-color:var(--vE)}.mcs-nr,.mcs-na{border-left-color:var(--mut)}
.mtk.mtk-ok{box-shadow:0 0 0 2px var(--vK)}
/* ===== 65 — Assistant de sélection d'un montage (présentation seule ; variables et classes existantes) ===== */
.asc .asl{display:block;margin:8px 0}.asc .asl>b,.asc .asf>b{display:block;margin:0 0 4px;font-size:13.5px}.asc select{width:100%;max-width:440px}
.asc .asf{margin:10px 0}.asc .pk{min-height:40px;padding:6px 12px}.asc .asn{margin:6px 0;font-size:13px;line-height:1.4}
.asr{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:8px;margin:8px 0}.asr.asr-ok{box-shadow:0 0 0 2px var(--vK,#1b6e3c)}
.asr-top{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:10px;align-items:start}.asr-svg{background:var(--sea);border-radius:8px;padding:4px}.asr-svg svg{width:100%;height:auto;max-height:90px;display:block}
.asr h4{margin:0 0 4px;font-size:15px}.asr .mcs{margin:4px 0 0}.asr-f{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.asc details.asd{margin:10px 0}.asc details.asd>summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
@media(max-width:560px){.asr-top{grid-template-columns:1fr}.asr-svg svg{max-height:80px}}
@media print{.asc{display:none}}
/* ===== v98 — Aide débutant : couche d'accompagnement indépendante (aucune logique métier, aucune donnée) ===== */
#gd:empty{display:none}
#gd .gd{border-left:4px solid var(--pri);background:var(--sea);margin-bottom:12px;padding:12px 14px}

#gd .gda{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
