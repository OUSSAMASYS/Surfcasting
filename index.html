const KN=[
{id:'pal',n:'Palomar',f:'Attache terminale',el:'Avançon → hameçon, émerillon ou agrafe',co:['bas','ham','eme','agr'],d:1,rs:'Très bonne, ≈ 95 % ou plus ; l’un des plus fiables, y compris en tresse.',us:'Hameçon, émerillon ou agrafe en nylon, fluorocarbone ou tresse ; le nœud « par défaut » des avançons.',av:'Facile à serrer, très solide, peu de ratés ; bon avec la tresse.',li:'Il faut passer l’hameçon ou l’émerillon dans la boucle (malaisé avec un gros montage) ; ne pas l’utiliser avec un hameçon à œillet trop serré.',st:['Doubler le fil sur ~15 cm et le passer dans l’œillet.','Faire un nœud simple lâche avec le fil doublé (sans le serrer).','Passer toute la boucle autour de l’hameçon ou de l’émerillon.','Mouiller, serrer les deux brins puis couper au ras.'],v:'pal'},
{id:'icl',n:'Improved Clinch',f:'Attache terminale',el:'Avançon → hameçon ou émerillon',co:['bas','ham','eme'],d:1,rs:'Bonne, ≈ 90–95 % en nylon ou fluorocarbone.',us:'Hameçons et émerillons avec nylon ou fluorocarbone de fin à moyen diamètre ; rapide à monter sur la plage.',av:'Très connu, rapide, peu de fil consommé.',li:'Déconseillé en tresse (glisse) ; glisse facilement si peu de tours ou fil gros ; bien mouiller avant de serrer.',st:['Passer le fil dans l’œillet, tirer ~15 cm.','Enrouler le brin libre 5–7 fois autour du brin principal.','Repasser le bout dans la petite boucle près de l’œillet, puis dans la grande boucle formée.','Mouiller et serrer, couper l’excédent.'],v:'icl'},
{id:'uni',n:'Uni Knot',f:'Attache terminale',el:'Avançon → hameçon, émerillon ou agrafe',co:['bas','ham','eme','agr'],d:1,rs:'Bonne, ≈ 90–95 % ; dépend du nombre de tours.',us:'Polyvalent : nylon, fluorocarbone et tresse (plus de tours pour la tresse), de l’hameçon au gros émerillon.',av:'Ajustable (on peut le faire coulisser avant de serrer) ; adaptable à tous les fils ; sert aussi de base au Double Uni.',li:'Un peu plus long à monter ; serrer progressivement pour éviter l’échauffement du fil.',st:['Passer le fil dans l’œillet, le replier parallèlement sur ~15 cm.','Faire une boucle et enrouler le bout 4–6 fois dans celle-ci (6–8 avec la tresse).','Mouiller, serrer en tirant sur le bout libre.','Faire coulisser le nœud vers l’œillet, serrer, couper.'],v:'uni'},
{id:'kl',n:'Nœud sans nœud (Knotless Knot)',f:'Attache terminale',el:'Avançon → hameçon à palette ou à œillet (fil aligné)',co:['bas','ham'],d:2,rs:'Bonne, ≈ 90 % (selon les enroulements) ; le fil sort droit.',us:'Quand il faut que l’appât soit présenté droit et que le fil sorte dans l’axe de la hampe ; montage « snell ».',av:'Meilleure présentation de l’appât et bon ferrage ; parfait pour la présentation discrète aux poissons méfiants.',li:'Plus long ; les enroulements doivent être serrés et bien placés ; peu utile avec la tresse.',st:['Passer le fil dans l’œillet en gardant ~10 cm derrière.','Faire une boucle le long de la hampe.','Enrouler le fil 6–8 fois autour de la hampe et de la boucle.','Serrer en tirant le fil principal ; couper le brin libre.'],v:'kl'},
{id:'alb',n:'Albright (et variantes)',f:'Raccord de lignes',el:'Corps de ligne (tresse) → avançon (fluorocarbone)',co:['corps','bas'],d:2,rs:'Moyenne à bonne, ≈ 75–85 % ; plus faible qu’un FG Knot mais bien plus rapide.',us:'Relier une tresse à un arraché en nylon ou fluorocarbone ; variante « Albright spécial » avec tresse et tour supplémentaire.',av:'Simple, rapide, fiable pour des diamètres différents.',li:'Plus volumineux que le FG Knot (peut claquer dans les anneaux) ; ne pas utiliser pour des diamètres trop proches.',st:['Faire une boucle au bout du gros fil (fluorocarbone ou nylon).','Passer le fil fin (tresse) dans la boucle.','Enrouler 8–10 fois le fil fin sur les deux brins du gros fil, en remontant vers la boucle.','Repasser le bout dans la boucle, mouiller, serrer puis couper ras.'],v:'alb'},
{id:'fg',n:'FG Knot',f:'Raccord de lignes',el:'Corps de ligne (tresse) → arraché (fluorocarbone)',co:['corps','bas'],d:3,rs:'Excellente, ≈ 90–95 % pour un nœud plat et fin.',us:'Lancer longue distance ; arraché en fluorocarbone sur tresse, avec passage dans les anneaux sans accrocher.',av:'Très fin et lisse (excellent au lancer) ; très résistant.',li:'Difficile ; demande de la pratique et de la tension ; long à réaliser à la plage. Toujours finir avec des demi-clefs de sécurité.',st:['Tendre le fluorocarbone (attaché à un point fixe).','Tresser la tresse en alternance dessus/dessous ~15–20 fois.','Tenir la tension, faire 2–3 demi-clefs de chaque côté.','Serrer, couper, vérifier en tirant fort.'],v:'fg'},
{id:'sur',n:'Nœud de chirurgien (Surgeon’s Knot)',f:'Raccord de lignes',el:'Deux longueurs de ligne (corps ↔ bas de ligne, ou nylon ↔ nylon)',co:['corps','bas'],d:1,rs:'Bonne, ≈ 85–90 % ; dépend des diamètres.',us:'Raccord rapide de deux lignes de nylon ou de fluorocarbone, dont les diamètres sont différents (jusqu’à ~1,5–2 fois).',av:'Très simple et rapide ; l’un des plus faciles à retenir.',li:'Moins fin qu’un FG Knot ; moins adapté à la tresse ; peu conseillé si les diamètres sont très éloignés.',st:['Superposer les deux fils sur ~15 cm.','Faire un nœud simple avec les deux fils ensemble.','Repasser une 2e fois (nœud double ou triple selon le diamètre).','Mouiller, serrer les 4 brins et couper les excédents.'],v:'sur'},
{id:'duni',n:'Double Uni (raccord de diamètres)',f:'Raccord de lignes',el:'Corps de ligne ↔ bas de ligne, deux diamètres ou natures différents',co:['corps','bas'],d:2,rs:'Bonne, ≈ 85–90 %.',us:'Raccorder deux diamètres ou deux matières (tresse/nylon, nylon/fluorocarbone) sans matériel.',av:'Fiable, polyvalent, facile à réaliser à la plage.',li:'Plus volumineux que le FG Knot ; bien équilibrer le nombre de tours sur chaque fil.',st:['Superposer les deux fils.','Avec un fil, faire un Uni Knot autour de l’autre (4–6 tours).','Faire de même avec l’autre fil en sens inverse.','Serrer chaque Uni puis les faire coulisser l’un contre l’autre.'],v:'duni'},
{id:'blo',n:'Nœud de sang (Blood Knot)',f:'Raccord de lignes',el:'Corps de ligne ↔ bas de ligne nylon / fluorocarbone (diamètres proches)',co:['corps','bas'],d:3,rs:'Très bonne, ≈ 90–95 % ; idéal pour un bas de ligne effilé en nylon.',us:'Raccord de nylon de diamètres proches pour un bas de ligne effilé (tapered leader).',av:'Symétrique et fin ; bon si bien réalisé.',li:'Long et délicat avec des lignes épaisses ; déconseillé avec la tresse ou des diamètres très différents.',st:['Croiser les deux fils.','Enrouler un fil autour de l’autre 4–5 fois, puis passer le bout dans le centre.','Faire de même avec l’autre fil en sens inverse.','Mouiller, serrer doucement et couper.'],v:'blo'},
{id:'bs',n:'Boucle simple (nœud en huit / overhand)',f:'Boucle',el:'Bout de corps de ligne ou d’avançon (pour agrafe ou boucle à boucle)',co:['corps','bas','agr'],d:1,rs:'Moyenne, ≈ 65–80 % ; la boucle simple tient moins qu’un nœud de chirurgien.',us:'Faire une petite boucle au bout d’un avançon ou d’un corps de ligne pour accrocher une agrafe.',av:'Immédiat, sans outil, facile à défaire.',li:'Peu résistant ; tend à se bloquer en gros diamètre ; le nœud en huit est plus fiable que l’overhand simple.',st:['Doubler le fil sur la longueur voulue.','Faire un nœud en huit avec le fil doublé.','Serrer lentement en mouillant.','Couper l’excédent (2–3 mm).'],v:'bs'},

${fld('Hameçon : taille (n°)',`<input id="hs" type="number" min="0" max="10" value="${r.hs}">`+GH('Plus le numéro est grand, plus l’hameçon est petit.'))}

<div class="card" id="bldc" data-st="2 3 4 5"><h2>Réglages</h2><p class="note">Cochez un élément pour l’ajouter au schéma.</p><div id="bld"></div></div>

<div class="card adv" id="epc" data-st="4"></div>
<div class="card adv" id="hkc" data-st="5"></div><div class="card adv" id="hkx" data-st="5"></div><div class="card adv" id="hkg" data-st="5"></div><div class="card adv" id="cpc" data-st="5"></div>
<div class="card" data-st="6" id="qvl"><div id="blr"></div></div>

<div class="card qadv" id="qadv"><h2>Paramètres avancés</h2><p class="note qadvn">${QADN(wzAdv)}</p><button type="button" class="g wzadv" aria-expanded="${wzAdv?'true':'false'}">${wzAdv?'▾ Masquer':'▸ Afficher'} les paramètres avancés</button><button type="button" class="g" data-qm="0" style="margin-top:8px">🧭 Ouvrir le parcours étape par étape</button></div>
<div class="wzadvrow wzadvf" style="margin:0 0 12px">${ab.replace(/^<div class="wzadvrow">/,"").replace(/<\/div>$/,"")}</div><div class="wzf" id="wzf"></div>
<div class="qbar noprint" id="qbar" role="group" aria-label="Montage actuel et accès rapides"><span class="qbt" id="qbt"></span><button type="button" class="vs qbs" id="qbs" data-wz="6"></button><button type="button" class="g" data-wzv="1" aria-label="Voir le schéma et la configuration">👁<span class="wzbn"> Aperçu</span></button><button type="button" class="g" id="qbx" data-qm="3" aria-label="Passer en mode expert">🛠<span class="wzbn"> Expert</span></button><button type="button" class="g" id="qba" data-qa="1" aria-pressed="false" aria-label="Afficher ou masquer les paramètres avancés">⚙<span class="wzbn"> Avancé</span></button><button type="button" class="g" data-qm="0" aria-label="Ouvrir le configurateur étape par étape">🧭<span class="wzbn"> Étapes</span></button></div>
</div>`;
$('wz').onclick=e=>{if(qcAct(e))return;if(e.target.closest('[data-qa]')){wzAdv=wzAdv?0:1;wzAdvUpd();return}if(e.target.closest('[data-wzv]')){const v=$('rvw');if(v)v.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});return}const td=e.target.closest('[data-td]');if(td){vfGo(td.dataset.tk,td.dataset.td);return}if(e.target.closest('.wzadv')){wzAdv=wzAdv?0:1;wzAdvUpd();return}const q=e.target.closest('[data-qm]');if(q){wzQ=+q.dataset.qm||0;wzUpd();const h=$('wzh');if(h)h.scrollIntoView({block:'start'});return}const b=e.target.closest('[data-wz]');if(b&&!b.disabled){if(wzQ)wzQGo(+b.dataset.wz);else wzGo(+b.dataset.wz)}};
$('dbd').onclick=dbClick;const up=()=>{const pm=r.mont,g=i=>$(i).value;Object.assign(r,{mont:g('mont'),bead:g('bead'),n:+g('n'),lead:g('lead'),g:+g('g'),ht:g('ht'),hs:+g('hs'),mT:g('mT'),mD:g('mD'),lT:g('lT'),lD:g('lD'),lc:+g('lc')});rgPut(r);save();if(pm!=r.mont)blRender();else blSync();blUpd();hkUp();mtInit();accInit();plInit();epInit();knInit();lgInit();cpInit()};
$('t-rig').querySelectorAll('.grid input,.grid select').forEach(e=>e.oninput=up);
$('cols').onclick=e=>{if(e.target.dataset.d!=null){r.cols.splice(+e.target.dataset.d,1);save();rig()}};
$('cols').oninput=e=>{if(e.target.dataset.i!=null){r.cols[+e.target.dataset.i]=e.target.value;rgPut(r);save()}};
$('addc').onclick=()=>{r.cols.push('#ff5722');save();rig()};hkInit();mtInit();asInit();accInit();plInit();epInit();knInit();lgInit();blBind();xpBind();blRender();wzFoot();blUpd();rgInit();dbObs();renderRecent()}
// ---------- journal
let LJ={v:null,e:null,a:null,o:{}};
function log(){const s=S.sess,D=LJ.c||{},ed=LJ.e!=null&&S.sessions[LJ.e],quick=!!LJ.q&&!ed,lsp=[...new Set(S.sessions.map(h=>h.spot).filter(Boolean).reverse())].slice(0,4),o=SP.map(x=>`<option value="${x.id}">${x.n} (min ${x.min} cm)</option>`).join('');
const dsp=D.sp||(S.catches[S.catches.length-1]||{}).sp,ocs=dsp?o.replace('value="'+dsp+'"','value="'+dsp+'" selected'):o;
$('t-log').innerHTML=`<div class="card"><h2>${LJ.e!=null&&S.sessions[LJ.e]?'✏️ Modifier la session':'Nouvelle session'}</h2>${LJ.e!=null&&S.sessions[LJ.e]?'<p class="note">Date, lieu et qualité de la session enregistrée du '+blE(S.sessions[LJ.e].date||'?')+'.</p>':`<p class="note gh">Une session = une sortie de pêche. Date et secteur suffisent ; le reste est facultatif.</p><div class="row lqm" role="group" aria-label="Mode de création"><button type="button" class="${quick?'b':'g'}" data-lq="1" aria-pressed="${quick}">⚡ Création rapide</button><button type="button" class="${quick?'g':'b'}" data-lq="0" aria-pressed="${!quick}">📝 Création complète</button></div>`}
${quick?`<div class="lqp" id="lqp"><div class="grid">${fld('Date',`<input type="date" data-s="date" value="${blE(s.date)}">`)}${fld('Secteur / plage',`<input id="lqs" data-s="spot" value="${blE(s.spot)}" placeholder="ex. Hammamet" autocomplete="off" enterkeyhint="done">`)}</div>${lsp.length?`<div class="lqc"><span class="note">Récents :</span>${lsp.map((x,i)=>`<button type="button" class="g sm" data-qsp="${i}">${blE(x)}</button>`).join('')}</div>`:''}<div class="lqr" id="lqr"><span class="note">Qualité (option) :</span>${[1,2,3,4,5].map(n=>`<button type="button" class="g" data-r="${n}" aria-label="${n} sur 5" style="font-size:18px;line-height:1;padding:4px 6px;opacity:${n<=s.rating?'1':'.3'}">⭐</button>`).join('')}<button type="button" class="g" data-r="0" style="font-size:12px">Supprimer</button></div><p class="row"><button class="b" id="qsv" type="button">⚡ Enregistrer la session</button></p><p class="note">Session identique à celle du formulaire complet : modifiable ensuite avec ✏️ Modifier.</p></div>`:''}
<div id="sfull"${quick?' hidden':''}><div class="grid">
${fld('Date',`<input type="date" data-s="date" value="${s.date}">`)}${fld('Secteur / plage',`<input data-s="spot" value="${s.spot}" placeholder="ex. Hammamet">`)}</div>
<div style="margin-top:10px"><label>Qualité de la session</label><div class="row" id="rating">${[1,2,3,4,5].map(n=>`<button type="button" class="g" data-r="${n}" style="font-size:18px;line-height:1;padding:4px 6px;opacity:${n<=s.rating?'1':'.3'}">⭐</button>`).join('')}<button type="button" class="g" data-r="0" style="font-size:12px">Supprimer</button></div><p class="note">${s.rating?s.rating+'/5 ⭐':'Aucune note'}</p></div>
<details class="spd" data-k="more"${LJ.o.more?' open':''}><summary>Plus de détails (heure, durée, marée)</summary><div class="grid">
${fld('Heure début',`<input type="time" data-s="start" value="${s.start}">`)}${fld('Durée (h)',`<input type="number" step=".5" data-s="dur" value="${s.dur}">`)}
${fld('Marée / coefficient',`<input data-s="tide" value="${s.tide}">`)}</div></details>
<p class="row"><button class="b" id="sv">${LJ.e!=null&&S.sessions[LJ.e]?'💾 Modifier la session':'💾 Enregistrer cette session dans l\'historique'}</button>${LJ.e!=null&&S.sessions[LJ.e]?'<button class="g" id="sc2" type="button">Annuler</button>':''}</p></div></div>
<div class="card"><h2>🌤️ Météo de la session</h2><details class="spd" data-k="wx"${LJ.o.wx?' open':''}><summary>${[s.wx,s.sea,s.temp?s.temp+' °C':'',s.wind?s.wind+' km/h'+(s.windDir?' '+s.windDir:''):''].filter(Boolean).map(blE).join(' · ')||'Renseigner la météo'} <span class="note">(modifier)</span></summary><div class="grid">
${fld('Température °C',`<input data-s="temp" value="${s.temp}" placeholder="ex. 22">`)}
${fld('Vent (km/h)',`<input data-s="wind" value="${s.wind}" placeholder="ex. 15">`)}
${fld('Direction du vent',`<select data-s="windDir"><option value=""${!s.windDir?' selected':''}>—</option>${['N','NE','E','SE','S','SO','O','NO'].map(a=>`<option${a==s.windDir?' selected':''}>${a}</option>`)}</select>`)}
${fld('État du ciel',`<select data-s="wx">${['Ensoleillé','Nuageux','Couvert','Pluie','Orage'].map(a=>`<option${a==s.wx?' selected':''}>${a}</option>`)}</select>`)}
${fld('État de la mer',`<select data-s="sea">${['Calme','Peu agitée','Agitée','Forte','Eau trouble'].map(a=>`<option${a==s.sea?' selected':''}>${a}</option>`)}</select>`)}
</div><p style="margin:8px 0 0"><button type="button" class="g sm" data-mtcgo="1">Voir les montages pertinents pour ces conditions</button></p></details></div>
<div class="card"><h2>Ajouter une prise</h2><p class="note gh">Seule l’espèce est nécessaire ; le reste est facultatif. Indiquez la taille pour être averti si elle est sous la taille minimale.</p><div class="grid">
${fld('Espèce',`<select id="cs">${ocs}</select>`)}${fld('Appât',`<input id="cb" list="bl" placeholder="ex. Crevette" value="${blE(D.b||'')}"><datalist id="bl">${[...new Set(SP.flatMap(x=>x.b))].map(b=>`<option>${b}`).join('')}</datalist>`)}
${fld('Taille (cm)',`<input id="cz" type="number" value="${blE(D.z||'')}">`)}${fld('Poids (g)',`<input id="cw" type="number" value="${blE(D.w||'')}">`)}
${fld('Distance de lancer (m)',`<input id="cd" type="number" value="${blE(D.d||'')}">`)}${fld('Heure de la touche',`<input id="ch" type="time" value="${blE(D.h||'')}">`)}
${fld('Ma photo (option)',`<input id="cp" type="file" accept="image/*">`)}</div>
<p><button class="b" id="ca">Ajouter</button></p></div>
<div class="card"><h2>Prises (${S.catches.length})</h2>${S.catches.map((c,i)=>{const sp=byId(c.sp)||SPX;return `<div class="catch" data-crow="${i}"><div>${c.img?`<img src="${c.img}" alt="" data-sp="${blE(c.sp)}" onerror="imgFail(this)">`:fish(sp,90)}</div><div><b>${sp.n}</b> · ${c.z||'?'} cm ${c.w?'· '+c.w+' g':''} ${c.z&&c.z<sp.min?`<span class="bad">sous taille (${sp.min}) : remise à l’eau</span>`:''}<br><span class="note">${c.b||'—'} · ${c.d||'?'} m · ${c.h||'?'} <button class="g" data-x="${i}">Supprimer</button></span></div></div>`}).join('')||'<p class="note">Aucune prise enregistrée pour l’instant. Choisissez une espèce dans « Ajouter une prise » : le reste est facultatif.</p>'}</div>
<div class="card"><h2>Historique des sessions (${S.sessions.length})</h2>
${LJ.v!=null&&S.sessions[LJ.v]?(()=>{const h=S.sessions[LJ.v],i=LJ.v;return `<div class="hd" data-hrow="${i}"><p><button class="g" data-hb>← Retour à la liste</button></p><h3 style="margin:4px 0">${blE(h.date||'?')}${h.spot?' · '+blE(h.spot):''}</h3><p>${h.rating?'<span class="tag on-s">⭐ '+h.rating+'/5</span> ':'<span class="tag">Sans note</span> '}<span class="tag">🎣 ${h.n||0} prise${h.n==1?'':'s'}</span>${h.fav?' <span class="tag">★ Favorite</span>':''}</p><p class="row">${favBtn('ses',i,'la session du '+(h.date||'?'))}<button class="b sm" data-qa="o">➕ Ajouter une prise</button><button class="b sm" data-he="${i}">✏️ Modifier</button><button class="g sm" data-hx="${i}">Supprimer</button></p>${LJ.a===i?(()=>{const ls=(S.catches[S.catches.length-1]||{}).sp,oo=ls?o.replace('value="'+ls+'"','value="'+ls+'" selected'):o;return `<div class="card" id="qa"><h3 style="margin:0 0 6px">Ajouter une prise à cette session</h3><div class="grid">${fld('Espèce',`<select id="qs">${oo}</select>`)}${fld('Appât',`<input id="qb" list="bl" placeholder="ex. Crevette" autocomplete="off">`)}${fld('Ma photo (option)',`<input id="qp" type="file" accept="image/*">`)}</div><p class="row"><button class="b" id="qok">Enregistrer la prise</button><button class="g" data-qa="x">Annuler</button></p><p class="note">Taille, poids, distance et heure restent modifiables ensuite dans le système habituel.</p></div>`})():''}<p><button class="g sm" data-hc>Voir les prises</button></p></div>`})():`${favFilter('ses')}<div style="margin-bottom:8px"></div>
${(()=>{const vis=S.sessions.map((h,i)=>({h,i})).filter(o=>!FV.ses||o.h.fav);
if(!vis.length)return FV.ses?'<p class="note">★ Aucune session favorite pour l’instant. Touchez ☆ sur une session pour l’ajouter ici.</p>':'<p class="note">Aucune session enregistrée pour l’instant. Remplissez « Nouvelle session » (date et secteur suffisent) et enregistrez-la : elle apparaîtra ici.</p>';
return vis.map(({h,i})=>`<div class="hc" data-hrow="${i}"><div class="hcm" data-hv="${i}" role="button" tabindex="0" aria-label="Consulter la session du ${blE(h.date||'?')}"><b>${blE(h.date||'?')}</b>${h.spot?' · '+blE(h.spot):''}<br><span class="note">${h.rating?'<span class="tag on-s">⭐ '+h.rating+'/5</span> ':''}<span class="tag">🎣 ${h.n||0} prise${h.n==1?'':'s'}</span></span></div><div class="row hca"><button class="g sm" data-hv="${i}">Consulter</button>${favBtn('ses',i,'la session du '+(h.date||'?'))}<button class="g sm" data-hx="${i}" aria-label="Supprimer la session du ${blE(h.date||'?')}">✕</button></div></div>`).join('')})()}`}
</div>`;

['Montage coulissant','Le plomb coulisse sur le fil : le poisson emporte l’appât sans sentir tout de suite le poids.'],
['Montage à plomb fixe','Le plomb ancre la ligne : montage simple et stable, la touche passe directement au scion.'],
['Montage à empiles','Plusieurs avançons latéraux : plusieurs appâts sur la même ligne.'],
['Scion','Pointe souple de la canne : elle signale la touche.']];
function lex(){return '<details class="gdl"><summary>📖 Lexique : les mots du montage</summary><dl class="gdd">'+LEX.map(function(x){return '<div><dt>'+x[0]+'</dt><dd>'+x[1]+'</dd></div>'}).join('')+'</dl></details>'}
function tabs(){return '<div class="gdmap"><span class="note">Autres rubriques :</span>'
+[['rig','🪝 Montage · composer sa ligne'],['log','📓 Journal · noter ses sorties'],['stat','📊 Statistiques · le bilan'],['rep','📄 Rapport PDF · imprimer']].map(function(x){return '<button type="button" class="g sm" data-ga="tab:'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'}

var G={
esp:{t:'Espèces : consulter un poisson',
p:'Les fiches des poissons du surfcasting en Tunisie : taille minimale, saison, appâts et montages possibles.',
s:[['Chaque carte donne déjà l’essentiel. « ⚡ Fiche rapide » le résume en quelques secondes ; « Détails de la fiche » déplie tout le reste.'],
['Cherchez par nom, appât ou saison, ou affichez ce qui se pêche ce mois-ci.',[['En saison ce mois','sf:now']]],
['★ garde une espèce en favori ; ⚖ Comparer en met jusqu’à 4 côte à côte.']],
x:tabs()},
rig:{t:'Montage : composer votre ligne',
p:'Choisissez les pièces de votre montage : le schéma, le résumé et la validation se mettent à jour en direct. Tout est enregistré automatiquement sur cet appareil.',
s:[['Tous les réglages ont déjà une valeur de départ : ne modifiez que ce que vous voulez.'],
['Choisissez votre façon de travailler : ⚡ Rapide = l’essentiel sur une page ; 🧭 Pas à pas = 6 étapes guidées ; Détail technique et 🛠 Expert = tous les paramètres.',[['⚡ Rapide','qm:1'],['🧭 Pas à pas','qm:0'],['🛠 Expert','qm:3']]],
['Touchez une pièce du schéma pour en voir le détail. Les mots techniques sont expliqués dans le lexique ci-dessous.'],
['Changer de mode ou ouvrir ⚙ Paramètres avancés ne fait rien perdre : tous les réglages restent accessibles.']],
x:lex()},
log:{t:'Journal : noter vos sorties et vos prises',
p:'Une session = une sortie de pêche. Une prise = un poisson. Tout reste sur votre appareil, même hors connexion.',
s:[['Créez une session : en ⚡ Création rapide, la date et le secteur suffisent (la date du jour est utilisée par défaut).'],
['Ajoutez une prise : seule l’espèce est nécessaire, le reste est facultatif.'],
['Retrouvez tout dans l’historique des sessions (☆ pour garder une session en favori) et dans 📊 Statistiques.']]},
stat:{t:'Statistiques : le bilan de votre journal',
p:'Calculées automatiquement à partir de vos sessions et de vos prises : rien à saisir ici.',
s:[['Tant que le journal est vide, cette page l’est aussi.',[['📓 Ouvrir le journal','tab:log']]],
['Après quelques sorties, des totaux et des classements apparaissent.']]},
rep:{t:'Rapport PDF : imprimer ou enregistrer',
p:'Met en page votre montage actuel et les informations de votre session dans un rapport imprimable.',
s:[['Vérifiez d’abord votre montage.',[['🪝 Ouvrir le montage','tab:rig']]],
['Touchez « Générer le PDF », puis choisissez « Enregistrer en PDF » dans la fenêtre d’impression.']]}
};

function $(i){return document.getElementById(i)}
var main=$('main'),nav=$('nav');if(!main||!nav)return;
var box=document.createElement('div');box.id='gd';box.className='noprint';main.insertBefore(box,main.firstChild);
if(st.off)document.body.classList.add('gd-off');

function cur(){var b=document.querySelector('nav button.on');return b&&b.dataset?b.dataset.k:''}
function tab(k){var b=document.querySelector('nav button[data-k="'+k+'"]');if(b)b.click()}
function btn(b){return '<button type="button" class="g sm" data-ga="'+b[1]+'">'+b[0]+'</button>'}
function steps(g){return '<ol class="gds">'+g.s.map(function(s){return '<li>'+s[0]+(s[1]?'<span class="gda">'+s[1].map(btn).join('')+'</span>':'')+'</li>'}).join('')+'</ol>'}
function full(k){var g=G[k];return '<div class="card gd" role="region" tabindex="-1" aria-label="Aide : '+g.t+'"><div class="gdh"><b>💡 '+g.t+'</b><button type="button" class="g sm" data-gc="close" aria-label="Fermer cette aide" title="Fermer (à rouvrir avec 💡 Aide en haut de page)">✕</button></div><p class="gdp">'+g.p+'</p>'+steps(g)+'<p class="gdn" data-gn="1"></p>'+(g.x||'')+'<div class="gdf"><button type="button" class="b sm" data-gc="close">Compris</button><button type="button" class="g sm" data-gc="off">Ne plus afficher les aides</button></div></div>'}
function mini(k){return '<div class="card gd gd-mini" role="region" aria-label="Aide : '+G[k].t+'"><span class="gdt">💡 Aide de cette rubrique</span><button type="button" class="g sm" data-gc="open">Afficher</button><button type="button" class="g sm" data-gc="close" aria-label="Masquer l’aide de cette rubrique">✕</button><span class="gdn" data-gn="1"></span></div>'}
function offNote(){return '<div class="card gd gd-mini" role="status"><span class="gdt">Aides masquées. Pour les revoir : bouton « 💡 Aide » en haut de page.</span><button type="button" class="g sm" data-gc="on">Annuler</button></div>'}

/* prochaine action logique : lecture seule du DOM, jamais bloquante */
function cnt(root,re){var h=root.querySelectorAll('h2');for(var i=0;i<h.length;i++){var m=re.exec(h[i].textContent);if(m)return +m[1]}return -1}
function nxt(k){try{
if(k==='log'){var l=$('t-log');if(!l)return'';var ns=cnt(l,/Historique des sessions \((\d+)\)/),nc=cnt(l,/^Prises \((\d+)\)/);if(ns<0||nc<0)return'';
if(!ns&&!nc)return'Prochaine étape : enregistrez votre première session (⚡ Création rapide).';
if(!ns)return'Prochaine étape : enregistrez la session de cette sortie.';
if(!nc)return'Prochaine étape : ajoutez votre première prise.';return''}
if(k==='stat'){var s=$('t-stat');if(s&&s.textContent.indexOf('Aucune donnée dans le journal')>=0)return'Prochaine étape : enregistrez une session ou une prise dans le journal.';return''}
}catch(e){}return''}
function hint(){var t=box.querySelector('[data-gn]');if(!t)return;var s=nxt(cur());t.textContent=s?'👉 '+s:''}

var shown='none',hb=null,lastK='';
function draw(k,m,focus){shown=m;
if(!k||!G[k]||m==='none')box.innerHTML='';
else if(m==='full')box.innerHTML=full(k);else if(m==='mini')box.innerHTML=mini(k);else box.innerHTML=offNote();
if(hb)hb.setAttribute('aria-expanded',m==='full'?'true':'false');hint();
if(focus==='box'){var r=box.querySelector('.gd');if(r)r.focus({preventScroll:true})}else if(focus==='btn'&&hb)hb.focus({preventScroll:true})}
function upd(){var k=cur();if(!k||k===lastK)return;lastK=k;var m;
if(st.off)m='none';else{var s=st.d[k]|0;m=s===0?'full':s===1?'mini':'none';if(s===0){st.d[k]=1;save()}}
draw(k,m)}

function act(a){var p=a.split(':'),t=p[0],v=p[1];
if(t==='tab')tab(v);
else if(t==='qm'){tab('rig');var b=document.querySelector('#wzh [data-qm="'+v+'"]');if(b)b.click()}
else if(t==='sf'){var f=document.querySelector('#spf [data-sf="'+v+'"]');if(f&&f.getAttribute('aria-pressed')!=='true')f.click();var q=$('spf');if(q&&q.scrollIntoView)q.scrollIntoView({block:'nearest'})}}

box.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('[data-ga],[data-gc]');if(!t)return;
if(t.dataset.ga){act(t.dataset.ga);return}
var c=t.dataset.gc,k=cur();
if(c==='close'){if(k){st.d[k]=2;save()}draw(k,'none','btn')}
else if(c==='open')draw(k,'full','box');
else if(c==='off'){st.off=1;save();document.body.classList.add('gd-off');draw(k,'off','btn')}
else if(c==='on'){st.off=0;save();document.body.classList.remove('gd-off');draw(k,'full','box')}});

/* bouton d'accès permanent : rien n'est définitivement masqué */
var kb=$('kbHelpBtn');
if(kb&&kb.parentNode){hb=document.createElement('button');hb.type='button';hb.id='gdBtn';hb.className='g sm noprint';hb.textContent='💡 Aide';hb.title='Aide pour débuter : explique la rubrique affichée';hb.setAttribute('aria-controls','gd');hb.setAttribute('aria-expanded','false');hb.style.cssText=kb.style.cssText;kb.parentNode.insertBefore(hb,kb);
hb.addEventListener('click',function(){var k=cur();if(!k)return;
if(st.off){st.off=0;save();document.body.classList.remove('gd-off');draw(k,'full','box');return}
if(shown==='full')draw(k,'none');else draw(k,'full','box')})}

/* libellés d'orientation (info-bulles) : n'écrasent aucun titre existant plus précis */
var NT={esp:'Espèces : fiches des poissons',rig:'Montage : composer et vérifier votre ligne',log:'Journal : noter vos sessions et vos prises',stat:'Statistiques : bilan de votre journal',rep:'Rapport PDF : page imprimable de votre montage'};
document.querySelectorAll('nav button[data-k]').forEach(function(b){if(NT[b.dataset.k])b.title=NT[b.dataset.k]});
var HT={exportBtn:'Enregistre une copie de vos montages, sessions et prises dans un fichier',importBtn:'Restaure une sauvegarde créée avec « Exporter mes données »'};
Object.keys(HT).forEach(function(i){var e=$(i);if(e&&!e.title)e.title=HT[i]});

/* suivi : changement de rubrique + mise à jour de l'indication « prochaine étape » */
var raf=0;function soon(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;try{upd();hint()}catch(e){}})}
new MutationObserver(soon).observe(nav,{attributes:true,attributeFilter:['class'],subtree:true});
['t-log','t-stat'].forEach(function(i){var e=$(i);if(e)new MutationObserver(soon).observe(e,{childList:true})});
upd();
}catch(err){try{console.warn('[Surfcasting] aide débutant désactivée',err)}catch(x){}}
})();
</script></body></html>
